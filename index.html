<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Car Race Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0f1a;overflow:hidden;font-family:Arial,sans-serif;color:#fff;}
canvas{display:block;position:fixed;top:0;left:0;}
#c{z-index:1;}
#floodCanvas{z-index:2;pointer-events:none;}
#confettiCanvas{z-index:19;pointer-events:none;}

#startScreen{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(8,12,22,0.97);z-index:30;padding:16px;
}
#startScreen h1{font-size:min(9vw,44px);color:#e94560;text-shadow:0 0 20px #e94560;margin-bottom:4px;}
#startScreen .sub{font-size:min(4vw,18px);color:#a29bfe;margin-bottom:6px;letter-spacing:2px;}
#startScreen p{color:#ccc;margin-bottom:18px;font-size:min(4vw,17px);}
.input-group{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:18px;}
.input-group label{font-size:min(5vw,21px);color:#fff;font-weight:bold;}
.input-group input{
  width:min(35vw,150px);padding:10px;text-align:center;
  font-size:min(8vw,34px);font-weight:bold;
  background:#1e2d3d;border:3px solid #e94560;color:#fff;border-radius:12px;outline:none;
}
.hint{font-size:min(3.5vw,15px);color:#aaa;}
#startBtn{
  padding:min(3.5vw,14px) min(10vw,46px);
  background:linear-gradient(135deg,#e94560,#a29bfe);
  border:none;color:#fff;font-size:min(5.5vw,22px);
  border-radius:40px;cursor:pointer;font-weight:bold;
}

/* HUD - 상단 고정, 얇게 */
#hud{
  position:fixed;top:0;left:0;right:0;height:40px;
  display:none;align-items:center;justify-content:space-between;
  padding:0 10px;background:rgba(0,0,0,0.85);z-index:10;gap:8px;
}
#hud h1{font-size:13px;color:#e94560;white-space:nowrap;flex-shrink:0;}
#timer{font-size:13px;color:#ffd700;white-space:nowrap;font-weight:bold;flex-shrink:0;}
#speedWrap{display:flex;align-items:center;gap:5px;flex:1;max-width:180px;}
#speedLabel{font-size:11px;color:#aaa;white-space:nowrap;}
#speedSlider{
  -webkit-appearance:none;width:100%;height:5px;border-radius:3px;
  background:linear-gradient(to right,#e94560,#a29bfe);outline:none;cursor:pointer;
}
#speedSlider::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fff;border:2px solid #e94560;cursor:pointer;
}
#speedVal{font-size:12px;color:#fff;font-weight:bold;min-width:26px;text-align:right;}

/* 하단 순위 바 - 게임판 위 반투명 오버레이, 1줄만 */
#rankBar{
  position:fixed;bottom:0;left:0;right:0;
  display:none;align-items:center;justify-content:flex-start;
  gap:3px;padding:2px 6px;
  background:rgba(0,0,0,0.55);z-index:10;
  flex-wrap:nowrap;overflow:hidden;height:22px;
}
.rk-item{
  display:flex;align-items:center;gap:2px;padding:1px 5px;
  border-radius:10px;font-size:9px;font-weight:bold;
  border:1px solid transparent;white-space:nowrap;flex-shrink:0;
}
.rk-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

/* 결과 오버레이 */
#overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.88);z-index:20;}
#overlay.show{display:flex;}
#podiumWrap{display:flex;align-items:flex-end;gap:8px;margin-bottom:14px;}
.podium-col{display:flex;flex-direction:column;align-items:center;gap:5px;}
.podium-rank{font-size:min(7vw,28px);font-weight:bold;}
.podium-name{font-size:min(3.5vw,14px);font-weight:bold;text-align:center;max-width:90px;}
.podium-block{border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;color:#000;}
#restartBtn{
  padding:12px 40px;background:linear-gradient(135deg,#e94560,#a29bfe);
  border:none;color:#fff;font-size:min(5vw,20px);border-radius:30px;cursor:pointer;font-weight:bold;
}
</style>
</head>
<body>
<div id="startScreen">
  <h1>🏁 Car Race Arena</h1>
  <div class="sub">✨ SPRUNKI EDITION ✨</div>
  <p>스프런키들의 미로 레이싱!</p>
  <div class="input-group">
    <label>🚗 자동차 대수</label>
    <input type="number" id="carCount" value="10" min="3" max="90">
    <span class="hint">3 ~ 90대</span>
  </div>
  <button id="startBtn" onclick="startGame()">게임 시작 🚗💨</button>
</div>
<div id="hud">
  <h1>🏁 Race</h1>
  <div id="timer">⏱ 15s</div>
  <div id="speedWrap">
    <span id="speedLabel">⚡</span>
    <input type="range" id="speedSlider" min="1" max="10" step="0.5" value="1">
    <span id="speedVal">×1</span>
  </div>
</div>
<canvas id="floodCanvas"></canvas>
<canvas id="c"></canvas>
<div id="rankBar"></div>
<div id="overlay">
  <div style="font-size:min(7vw,30px);color:#ffd700;text-shadow:0 0 20px #ffd700;margin-bottom:14px;font-weight:bold;">🏆 시상대 🏆</div>
  <div id="podiumWrap"></div>
  <button id="restartBtn" onclick="showStart()">다시 시작 🔄</button>
</div>
<canvas id="confettiCanvas"></canvas>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const floodCv=document.getElementById('floodCanvas');
const fCtx=floodCv.getContext('2d');
const confCv=document.getElementById('confettiCanvas');
const confCtx=confCv.getContext('2d');
let W,H;
const HUD_H=40;

function resize(){
  W=canvas.width=floodCv.width=confCv.width=window.innerWidth;
  H=canvas.height=floodCv.height=confCv.height=window.innerHeight;
}
window.addEventListener('resize',()=>{resize();if(gameStarted&&!gameOver){initGame();}});

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.arcTo(x+w,y,x+w,y+r,r);
    this.lineTo(x+w,y+h-r);this.arcTo(x+w,y+h,x+w-r,y+h,r);
    this.lineTo(x+r,y+h);this.arcTo(x,y+h,x,y+h-r,r);
    this.lineTo(x,y+r);this.arcTo(x,y,x+r,y,r);this.closePath();
  };
}

// 속도 슬라이더
let speedMult=1;
document.getElementById('speedSlider').addEventListener('input',function(){
  speedMult=parseFloat(this.value);
  document.getElementById('speedVal').textContent='×'+speedMult;
});

// 캐릭터 목록
const SPRUNKI=[
  {name:'Raddy',color:'#e82020'},{name:'Oren',color:'#ff8c00'},
  {name:'Simon',color:'#f5d000'},{name:'OWAKCX',color:'#4caf50'},
  {name:'Vineria',color:'#2e7d32'},{name:'Sky',color:'#4dd0e1'},
  {name:'Jevin',color:'#3949ab'},{name:'Durple',color:'#8e24aa'},
  {name:'Pinki',color:'#f06292'},{name:'Wenda',color:'#e0e0e0'},
  {name:'Gray',color:'#78909c'},{name:'Black',color:'#37474f'},
  {name:'Brud',color:'#6d4c41'},{name:'Tunner',color:'#bcaaa4'},
  {name:'Garnold',color:'#f9a825'},{name:'Clukr',color:'#9e9e9e'},
  {name:'Funbot',color:'#00bcd4'},{name:'Blazer',color:'#ff5722'},
  {name:'Frostie',color:'#80d8ff'},{name:'Neon',color:'#aeea00'},
  {name:'Mystic',color:'#ce93d8'},{name:'Cobalt',color:'#1565c0'},
  {name:'Amber',color:'#ffb300'},{name:'Crimson',color:'#c62828'},
  {name:'Teal',color:'#00897b'},{name:'Coral',color:'#ff7043'},
  {name:'Indigo',color:'#5c6bc0'},{name:'Lime',color:'#8bc34a'},
  {name:'Rose',color:'#e91e63'},{name:'Copper',color:'#e65100'},
];

function lighten(hex,amt){
  let r=parseInt(hex.slice(1,3),16)||0,g=parseInt(hex.slice(3,5),16)||0,b=parseInt(hex.slice(5,7),16)||0;
  return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v+amt)).toString(16).padStart(2,'0')).join('');
}

// 캐릭터 얼굴 그리기
function drawFace(c,x,y,size,k){
  k=k||ctx;const s=size/60;
  k.save();k.translate(x,y);
  k.fillStyle=c.color;k.beginPath();k.ellipse(0,0,22*s,24*s,0,0,Math.PI*2);k.fill();
  const sd=c.name.charCodeAt(0)%6;
  k.fillStyle=lighten(c.color,-35);
  if(sd===0){for(let i=0;i<3;i++){const a=-Math.PI/2+(i-1)*0.5;k.save();k.translate(Math.cos(a)*19*s,Math.sin(a)*19*s);k.rotate(a+Math.PI/2);k.beginPath();k.moveTo(0,0);k.lineTo(-4*s,-12*s);k.lineTo(4*s,-12*s);k.closePath();k.fill();k.restore();}}
  else if(sd===1){k.strokeStyle=c.color;k.lineWidth=3*s;k.lineCap='round';k.beginPath();k.moveTo(-7*s,-23*s);k.lineTo(-7*s,-36*s);k.stroke();k.beginPath();k.moveTo(7*s,-23*s);k.lineTo(7*s,-36*s);k.stroke();k.fillStyle=lighten(c.color,40);k.beginPath();k.arc(-7*s,-38*s,5*s,0,Math.PI*2);k.fill();k.beginPath();k.arc(7*s,-38*s,5*s,0,Math.PI*2);k.fill();}
  else if(sd===2){k.beginPath();k.arc(-17*s,-17*s,8*s,0,Math.PI*2);k.fill();k.beginPath();k.arc(17*s,-17*s,8*s,0,Math.PI*2);k.fill();}
  else if(sd===3){k.beginPath();k.moveTo(-4*s,-22*s);k.lineTo(0,-36*s);k.lineTo(4*s,-22*s);k.closePath();k.fill();}
  else if(sd===4){k.strokeStyle=c.color;k.lineWidth=4*s;k.beginPath();k.arc(0,-5*s,23*s,Math.PI+0.3,-0.3,false);k.stroke();k.fillStyle=lighten(c.color,30);k.beginPath();k.ellipse(-22*s,-5*s,5*s,7*s,0,0,Math.PI*2);k.fill();k.beginPath();k.ellipse(22*s,-5*s,5*s,7*s,0,0,Math.PI*2);k.fill();}
  else{k.fillStyle=lighten(c.color,30);k.beginPath();k.ellipse(-7*s,-20*s,7*s,4*s,-0.4,0,Math.PI*2);k.fill();k.beginPath();k.ellipse(7*s,-20*s,7*s,4*s,0.4,0,Math.PI*2);k.fill();k.beginPath();k.arc(0,-20*s,3.5*s,0,Math.PI*2);k.fill();}
  k.fillStyle='#fff';k.beginPath();k.ellipse(-7*s,-1*s,7*s,7*s,0,0,Math.PI*2);k.fill();k.beginPath();k.ellipse(7*s,-1*s,7*s,7*s,0,0,Math.PI*2);k.fill();
  k.fillStyle='#111';k.beginPath();k.ellipse(-7*s,-1*s,5*s,5*s,0,0,Math.PI*2);k.fill();k.beginPath();k.ellipse(7*s,-1*s,5*s,5*s,0,0,Math.PI*2);k.fill();
  k.fillStyle=c.color;k.beginPath();k.ellipse(-7*s,-4*s,7.5*s,4*s,0,Math.PI,Math.PI*2);k.fill();k.beginPath();k.ellipse(7*s,-4*s,7.5*s,4*s,0,Math.PI,Math.PI*2);k.fill();
  k.strokeStyle='#111';k.lineWidth=2*s;k.lineCap='round';k.beginPath();k.arc(0,12*s,5*s,0.2,Math.PI-0.2);k.stroke();
  k.restore();
}

// ── 미로 ─────────────────────────────────────────────────────────────────────
const CELL=46; // 작은 셀 → 칸 수 증가 → 더 복잡
let walls=[],wallRight=[],wallBottom=[],COLS,ROWS,mazeOX,mazeOY;

function buildMaze(){
  COLS=Math.max(5,Math.floor(W/CELL));
  ROWS=Math.max(5,Math.floor((H-HUD_H)/CELL));
  mazeOX=(W-COLS*CELL)/2;
  mazeOY=HUD_H+(H-HUD_H-ROWS*CELL)/2;
  walls=[];
  // wallRight[r][c]: 오른쪽 벽 있음, wallBottom[r][c]: 아래 벽 있음
  wallRight=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  wallBottom=Array.from({length:ROWS},()=>Array(COLS).fill(false));

  const cw=Array.from({length:ROWS},()=>Array(COLS).fill(3));
  const vis=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  const stack=[{r:0,c:0}];vis[0][0]=true;
  while(stack.length){
    const{r,c}=stack[stack.length-1];
    const nb=shuffle([[0,1],[0,-1],[1,0],[-1,0]]).map(([dr,dc])=>({dr,dc,nr:r+dr,nc:c+dc})).filter(({nr,nc})=>nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!vis[nr][nc]);
    if(!nb.length){stack.pop();continue;}
    const{dr,dc,nr,nc}=nb[0];vis[nr][nc]=true;
    if(dr===0&&dc===1)cw[r][c]&=~1;if(dr===0&&dc===-1)cw[r][nc]&=~1;
    if(dr===1&&dc===0)cw[r][c]&=~2;if(dr===-1&&dc===0)cw[nr][nc]&=~2;
    stack.push({r:nr,c:nc});
  }
  // 벽 3%만 추가 제거 → 거의 완전한 미로, 두 단계 복잡
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(Math.random()<0.03){if(c<COLS-1)cw[r][c]&=~1;else if(r<ROWS-1)cw[r][c]&=~2;}
  }
  function addWall(x1,y1,x2,y2){
    const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
    if(len<0.01)return;walls.push({x1,y1,x2,y2,nx:-dy/len,ny:dx/len,len});
  }
  addWall(mazeOX,mazeOY,mazeOX+COLS*CELL,mazeOY);
  addWall(mazeOX,mazeOY+ROWS*CELL,mazeOX+COLS*CELL,mazeOY+ROWS*CELL);
  addWall(mazeOX,mazeOY,mazeOX,mazeOY+ROWS*CELL);
  addWall(mazeOX+COLS*CELL,mazeOY,mazeOX+COLS*CELL,mazeOY+ROWS*CELL);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=mazeOX+c*CELL,y=mazeOY+r*CELL;
    if(cw[r][c]&1){addWall(x+CELL,y,x+CELL,y+CELL);wallRight[r][c]=true;}
    if(cw[r][c]&2){addWall(x,y+CELL,x+CELL,y+CELL);wallBottom[r][c]=true;}
  }
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

// ── 골 ───────────────────────────────────────────────────────────────────────
let GOAL={},goalActive=false,goalTimer=0;
const GOAL_DELAY=15000; // 15초 후 골 활성

function placeGoal(){
  GOAL={x:mazeOX+(COLS-1)*CELL+6,y:mazeOY+(ROWS-1)*CELL+6,w:CELL-12,h:CELL-12};
  goalActive=false;goalTimer=0;
}

// ── 홍수 (골 활성화와 동시에 시작, 속도는 자동차 기본속도의 절반) ─────────────
let floodActive=false;
let floodCells=new Set();
let floodFrontier=[];
let floodTimer=0;
// 홍수 확산 간격: 자동차 기본이동속도 대비 절반 속도 (ms per step)
// BASE_SPEED 픽셀/프레임 → 셀하나(CELL px) 이동시간 = CELL/BASE_SPEED 프레임 * 16ms
// 홍수는 그것의 2배 (절반 속도)
const FLOOD_INTERVAL_BASE=()=>((CELL/BASE_SPEED)*16*2)/speedMult;

function startFlood(){
  floodActive=true;floodCells.clear();floodFrontier=[];floodTimer=0;
  for(const[r,c]of[[0,0],[0,1],[1,0]]){
    const k=r+','+c;if(!floodCells.has(k)){floodCells.add(k);floodFrontier.push({r,c});}
  }
}

function updateFlood(dt){
  if(!floodActive||floodFrontier.length===0)return;
  floodTimer+=dt;
  const interval=FLOOD_INTERVAL_BASE();
  while(floodTimer>=interval&&floodFrontier.length>0){
    floodTimer-=interval;
    const next=[];
    for(const{r,c}of floodFrontier){
      const nb=[];
      if(c+1<COLS&&!wallRight[r][c])nb.push([r,c+1]);
      if(c-1>=0&&!wallRight[r][c-1])nb.push([r,c-1]);
      if(r+1<ROWS&&!wallBottom[r][c])nb.push([r+1,c]);
      if(r-1>=0&&!wallBottom[r-1][c])nb.push([r-1,c]);
      for(const[nr,nc]of nb){const k=nr+','+nc;if(!floodCells.has(k)){floodCells.add(k);next.push({r:nr,c:nc});}}
    }
    floodFrontier=next;
  }
}

function drawFlood(){
  fCtx.clearRect(0,0,W,H);
  if(!floodActive)return;
  fCtx.fillStyle='rgba(200,30,30,0.50)';
  for(const key of floodCells){
    const[r,c]=key.split(',').map(Number);
    fCtx.fillRect(mazeOX+c*CELL+1,mazeOY+r*CELL+1,CELL-2,CELL-2);
  }
}

// ── 자동차 ────────────────────────────────────────────────────────────────────
const BASE_SPEED=3.2,CAR_R=12;
const RESTITUTION=0.78,WALL_REST=0.72,FRICTION=0.9988;
let cars=[],particles=[],gameOver=false,gameStarted=false,animId,lastTime=0;
let finishers=[];

// 직진 카운터 & 방향 전환 로직
// 각 자동차: straightCount(현재 방향 연속 횟수), lastCardinal(마지막 카디널 방향 인덱스)
const CARDINALS=[0,Math.PI/2,Math.PI,Math.PI*3/2]; // 12,3,6,9시
const DIAGONALS=[Math.PI/4,Math.PI*3/4,Math.PI*5/4,Math.PI*7/4];

function getCardinalIdx(angle){
  // 가장 가까운 카디널 방향 인덱스
  let best=0,bestD=Infinity;
  for(let i=0;i<4;i++){let d=Math.abs(normalizeAngle(angle-CARDINALS[i]));if(d<bestD){bestD=d;best=i;}}
  return best;
}
function normalizeAngle(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}

function spawnCars(){
  const count=Math.min(Math.max(parseInt(document.getElementById('carCount').value)||10,3),90);
  cars=[];finishers=[];
  // 90대 지원: SPRUNKI 배열 반복 확장
  const chars=[];
  const base=shuffle([...SPRUNKI]);
  for(let i=0;i<count;i++){
    const orig=base[i%base.length];
    const rep=Math.floor(i/base.length);
    chars.push(rep===0?{...orig}:{name:orig.name+(rep+1),color:lighten(orig.color,(rep%2===0?55:-55))});
  }
  // 출발: 좌상단 여러 셀 분산
  const spawnArea=Math.min(COLS-1,Math.ceil(Math.sqrt(count*2)));
  const pool=[];
  for(let r=0;r<Math.min(spawnArea,ROWS);r++)for(let c=0;c<Math.min(spawnArea,COLS);c++)pool.push([r,c]);
  shuffle(pool);
  for(let i=0;i<count;i++){
    const[r,c]=pool[i%pool.length];
    const ang=CARDINALS[Math.floor(Math.random()*4)];
    const sp=BASE_SPEED+(Math.random()-.5)*0.5;
    const ch=chars[i];
    cars.push({
      name:ch.name,color:ch.color,
      x:mazeOX+c*CELL+CELL/2+(Math.random()-.5)*10,
      y:mazeOY+r*CELL+CELL/2+(Math.random()-.5)*10,
      vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
      omega:0,angle:ang,trail:[],alive:true,finished:false,
      straightCount:0,      // 현재 방향 유지 카운트
      lastCardinalIdx:getCardinalIdx(ang), // 현재 카디널 방향 인덱스
      diagPhase:false       // 대각선 중인지
    });
  }
  particles=[];
  buildRankBar();
}

function buildRankBar(){
  const rb=document.getElementById('rankBar');
  rb.innerHTML='';
  for(const c of cars){
    const d=document.createElement('div');d.className='rk-item';d.id='rki-'+c.name.replace(/[^a-zA-Z0-9]/g,'_');
    d.style.cssText='background:'+c.color+'25;border-color:'+c.color+'66;color:'+c.color;
    d.innerHTML='<span class="rk-dot" style="background:'+c.color+'"></span>'+c.name;
    rb.appendChild(d);
  }
}

// ── 파티클 ────────────────────────────────────────────────────────────────────
function spawnImpact(x,y,vx,vy,col,intensity){
  for(let i=0;i<Math.floor(5+intensity*7);i++){
    const spd=(1+Math.random()*2)*intensity;
    const ang=Math.atan2(vy,vx)+Math.PI+(Math.random()-.5)*Math.PI*1.8;
    particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:1,decay:.05+Math.random()*.04,r:1+Math.random()*2.5,col,sw:false});
  }
  for(let i=0;i<3;i++){const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*2;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.07+Math.random()*.05,r:1.5,col:'#ffe066',sw:false});}
}
function updateParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=p.decay;if(p.life<=0){particles.splice(i,1);continue;}p.x+=p.vx;p.y+=p.vy;p.vx*=.88;p.vy*=.88;}}
function drawParticles(){ctx.save();ctx.shadowBlur=0;for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.restore();}

// ── 물리 ─────────────────────────────────────────────────────────────────────
function curMax(){return BASE_SPEED*speedMult*2.2;}
function curMin(){return BASE_SPEED*speedMult*0.7;}

function enforceSpeed(c){
  const s=Math.sqrt(c.vx*c.vx+c.vy*c.vy);
  if(s<0.01)return;
  const mn=curMin(),mx=curMax();
  if(s<mn){c.vx=c.vx/s*mn;c.vy=c.vy/s*mn;}
  else if(s>mx){c.vx=c.vx/s*mx;c.vy=c.vy/s*mx;}
}

// 카디널 방향 바운스 + 직진 카운터
function applyCardinalBias(c){
  const spd=Math.sqrt(c.vx*c.vx+c.vy*c.vy);
  if(spd<0.01)return;
  let angle=Math.atan2(c.vy,c.vx);

  // 대각선 페이즈: 45도 방향 유지, 한 스텝만
  if(c.diagPhase){
    // 대각선 방향 중 가장 가까운 것
    let best=0,bestD=Infinity;
    for(let i=0;i<4;i++){let d=Math.abs(normalizeAngle(angle-DIAGONALS[i]));if(d<bestD){bestD=d;best=i;}}
    const target=DIAGONALS[best];
    let da=normalizeAngle(target-angle);
    angle+=da*0.18;
    c.vx=Math.cos(angle)*spd;c.vy=Math.sin(angle)*spd;
    // 대각선 이동 거리 누적
    c.diagDist=(c.diagDist||0)+spd;
    if(c.diagDist>CELL*0.7){c.diagPhase=false;c.diagDist=0;c.straightCount=0;}
    return;
  }

  // 카디널 방향으로 부드럽게 스냅
  let best=0,bestD=Infinity;
  for(let i=0;i<4;i++){let d=Math.abs(normalizeAngle(angle-CARDINALS[i]));if(d<bestD){bestD=d;best=i;}}
  const target=CARDINALS[best];
  let da=normalizeAngle(target-angle);
  angle+=da*0.22;
  c.vx=Math.cos(angle)*spd;c.vy=Math.sin(angle)*spd;

  // 같은 카디널 방향인지 카운트
  if(best===c.lastCardinalIdx){
    c.straightCount=(c.straightCount||0)+1;
    // 10번 반복 후 대각선 전환
    if(c.straightCount>=10*(60/speedMult)){
      c.diagPhase=true;c.diagDist=0;c.straightCount=0;
      // 현재 방향 기준 ±45도 대각선으로
      const diagIdx=(best*2+(Math.random()>.5?1:0))%4; // 인접 대각선
      const newAngle=DIAGONALS[diagIdx];
      c.vx=Math.cos(newAngle)*spd;c.vy=Math.sin(newAngle)*spd;
    }
  } else {
    c.lastCardinalIdx=best;c.straightCount=0;
  }
}

function resolveWall(car){
  for(const w of walls){
    const{x1,y1,x2,y2,nx,ny,len}=w;
    const dx=car.x-x1,dy=car.y-y1,dist=dx*nx+dy*ny;
    if(dist>CAR_R||dist<-CAR_R)continue;
    const wx=x2-x1,wy=y2-y1,t=(dx*wx+dy*wy)/(len*len);
    if(t<-.01||t>1.01)continue;
    if(Math.abs(dist)<CAR_R){
      const pen=CAR_R-Math.abs(dist),sg=dist<0?-1:1;
      car.x+=nx*pen*sg;car.y+=ny*pen*sg;
      const vn=car.vx*nx+car.vy*ny;if(vn*sg>0)continue;
      const j=-(1+WALL_REST)*vn;car.vx+=j*nx;car.vy+=j*ny;
      const tx=-ny,ty=nx,vt=car.vx*tx+car.vy*ty;
      car.vx-=.06*vt*tx;car.vy-=.06*vt*ty;car.omega=vt*.03;
      // 벽 충돌 시 직진 카운터 리셋 + 카디널 방향 재결정
      car.straightCount=0;car.diagPhase=false;
      car.lastCardinalIdx=getCardinalIdx(Math.atan2(car.vy,car.vx));
      spawnImpact(car.x,car.y,car.vx,car.vy,car.color,0.8);
      enforceSpeed(car);
    }
  }
}
function resolveCarCar(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist===0||dist>=CAR_R*2)return;
  const nx=dx/dist,ny=dy/dist,ov=(CAR_R*2-dist)/2+.4;
  a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
  const rvx=a.vx-b.vx,rvy=a.vy-b.vy,vRel=rvx*nx+rvy*ny;
  if(vRel<=0)return;
  const j=-(1+RESTITUTION)*vRel*.5;
  a.vx+=j*nx;a.vy+=j*ny;b.vx-=j*nx;b.vy-=j*ny;
  const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty;
  a.omega+=vt*.04;b.omega-=vt*.04;
  enforceSpeed(a);enforceSpeed(b);
  spawnImpact((a.x+b.x)/2,(a.y+b.y)/2,rvx,rvy,'#fff',1.0);
}

// 홍수 셀 안 자동차 → 골 방향으로 밀기
function pushCarsFromFlood(){
  if(!floodActive)return;
  const gx=GOAL.x+GOAL.w/2,gy=GOAL.y+GOAL.h/2;
  for(const car of cars){
    if(!car.alive||car.finished)continue;
    const cr=Math.floor((car.y-mazeOY)/CELL),cc=Math.floor((car.x-mazeOX)/CELL);
    if(cr<0||cr>=ROWS||cc<0||cc>=COLS)continue;
    if(floodCells.has(cr+','+cc)){
      const ddx=gx-car.x,ddy=gy-car.y,dl=Math.sqrt(ddx*ddx+ddy*ddy)||1;
      car.vx+=ddx/dl*0.6*speedMult;car.vy+=ddy/dl*0.6*speedMult;
      enforceSpeed(car);
    }
  }
}

// ── 폭죽 ─────────────────────────────────────────────────────────────────────
let confetti=[];
function launchConfetti(){
  confetti=[];
  const cols=['#e94560','#f9a825','#4caf50','#4dd0e1','#a29bfe','#ff6b6b','#ffd700','#fff','#ff80ab'];
  for(let i=0;i<260;i++)confetti.push({
    x:Math.random()*W,y:-10-Math.random()*120,
    vx:(Math.random()-.5)*4,vy:1.5+Math.random()*4,
    col:cols[Math.floor(Math.random()*cols.length)],
    w:5+Math.random()*9,h:3+Math.random()*4,
    rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*0.18,
    life:1,decay:0.003+Math.random()*0.003
  });
}
function updateConfetti(){for(let i=confetti.length-1;i>=0;i--){const p=confetti[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.rot+=p.rv;p.life-=p.decay;if(p.y>H+20||p.life<=0)confetti.splice(i,1);}}
function drawConfetti(){
  confCtx.clearRect(0,0,W,H);
  for(const p of confetti){
    confCtx.save();confCtx.globalAlpha=p.life;confCtx.translate(p.x,p.y);confCtx.rotate(p.rot);
    confCtx.fillStyle=p.col;confCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);confCtx.restore();
  }
}

// ── 시상대 ────────────────────────────────────────────────────────────────────
function showPodium(){
  const pw=document.getElementById('podiumWrap');pw.innerHTML='';
  // 순서: 2등(왼), 1등(중), 3등(오)
  const positions=[1,0,2];
  const blockH=[90,120,65];   // 시상대 블록 높이
  const medals=['🥈','🥇','🥉'];
  const rankNums=['2','1','3'];
  const bgCols=['#9e9e9e','#ffd700','#cd7f32'];
  positions.forEach((pos,i)=>{
    const f=finishers[pos];if(!f)return;
    const col=document.createElement('div');col.className='podium-col';
    // ① 메달 이모지
    const rank=document.createElement('div');rank.className='podium-rank';rank.textContent=medals[i];
    // ② 얼굴 캔버스
    const fsz=pos===0?80:64;
    const fc=document.createElement('canvas');fc.className='podium-face';fc.width=fsz;fc.height=fsz;
    const fk=fc.getContext('2d');
    fk.fillStyle=f.color+'33';fk.beginPath();fk.arc(fsz/2,fsz/2,fsz/2,0,Math.PI*2);fk.fill();
    drawFace(f,fsz/2,fsz/2,fsz*0.72,fk);
    // ③ 이름
    const nm=document.createElement('div');nm.className='podium-name';nm.style.color=f.color;nm.textContent=f.name;
    // ④ 시상대 블록 (번호만, 메달 없음)
    const bw=pos===0?84:68;
    const blk=document.createElement('div');blk.className='podium-block';
    blk.style.cssText=`width:${bw}px;height:${blockH[i]}px;background:${bgCols[i]};`
      +`border-radius:6px 6px 0 0;display:flex;align-items:center;justify-content:center;`
      +`font-size:28px;font-weight:900;color:rgba(0,0,0,0.45);`;
    blk.textContent=rankNums[i];
    // 조립: 메달 → 얼굴 → 이름 → 블록 (위→아래)
    col.appendChild(rank);
    col.appendChild(fc);
    col.appendChild(nm);
    col.appendChild(blk);
    pw.appendChild(col);
  });
  document.getElementById('overlay').classList.add('show');
  launchConfetti();
  (function loop(){if(confetti.length===0){confCtx.clearRect(0,0,W,H);return;}updateConfetti();drawConfetti();requestAnimationFrame(loop);})();
}

// ── 업데이트 ──────────────────────────────────────────────────────────────────
function update(dt){
  if(!goalActive){
    goalTimer+=dt;
    if(goalTimer>=GOAL_DELAY){goalActive=true;startFlood();}
  }
  updateFlood(dt);
  pushCarsFromFlood();
  updateParticles();

  for(const c of cars){
    if(!c.alive||c.finished)continue;
    // 속도 배율 적용
    const sm=speedMult;
    c.trail.push({x:c.x,y:c.y});if(c.trail.length>12)c.trail.shift();
    c.x+=c.vx*sm;c.y+=c.vy*sm;
    c.vx*=FRICTION;c.vy*=FRICTION;
    c.angle+=c.omega;c.omega*=0.85;
    if(Math.abs(c.omega)<.02){
      let da=Math.atan2(c.vy,c.vx)-c.angle;
      while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
      c.angle+=da*.15;
    }
    applyCardinalBias(c);
    enforceSpeed(c);
    resolveWall(c);
  }
  for(let it=0;it<2;it++)
    for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++)
      if(cars[i].alive&&!cars[i].finished&&cars[j].alive&&!cars[j].finished)
        resolveCarCar(cars[i],cars[j]);

  // 골 체크
  if(goalActive){
    for(const c of cars){
      if(!c.alive||c.finished)continue;
      if(c.x>GOAL.x&&c.x<GOAL.x+GOAL.w&&c.y>GOAL.y&&c.y<GOAL.y+GOAL.h){
        c.finished=true;finishers.push({name:c.name,color:c.color});
        const el=document.getElementById('rki-'+c.name.replace(/[^a-zA-Z0-9]/g,'_'));
        if(el){
          el.style.background=c.color+'55';el.style.borderColor=c.color;
          el.innerHTML='<span class="rk-dot" style="background:'+c.color+'"></span>'+['🥇','🥈','🥉'][finishers.length-1]+c.name;
        }
        if(finishers.length>=3){gameOver=true;setTimeout(showPodium,500);return;}
      }
    }
  }
  const rem=Math.max(0,(GOAL_DELAY-goalTimer)/1000);
  document.getElementById('timer').textContent=goalActive?'🏁 GOAL!':'⏱ '+rem.toFixed(1)+'s';
}

// ── 그리기 ────────────────────────────────────────────────────────────────────
function drawMaze(){
  ctx.save();ctx.strokeStyle='#2a9d8f';ctx.lineWidth=2.5;ctx.shadowColor='#2a9d8f';ctx.shadowBlur=7;
  for(const w of walls){ctx.beginPath();ctx.moveTo(w.x1,w.y1);ctx.lineTo(w.x2,w.y2);ctx.stroke();}
  ctx.restore();
}
function drawGoal(){
  const pulse=Math.sin(Date.now()/200)*.12;ctx.save();
  if(!goalActive){
    const rem=Math.max(0,(GOAL_DELAY-goalTimer)/1000);
    ctx.fillStyle='rgba(70,70,70,0.3)';ctx.fillRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);
    ctx.strokeStyle='#555';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.strokeRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);ctx.setLineDash([]);
    ctx.fillStyle='#777';ctx.font='bold 11px Arial';ctx.textAlign='center';
    ctx.fillText('🔒',GOAL.x+GOAL.w/2,GOAL.y+GOAL.h/2-4);ctx.fillText(rem.toFixed(1)+'s',GOAL.x+GOAL.w/2,GOAL.y+GOAL.h/2+11);
  } else {
    ctx.shadowColor='#ffd700';ctx.shadowBlur=28;
    ctx.fillStyle='rgba(255,215,0,'+(0.28+pulse)+')';ctx.fillRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);
    ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.setLineDash([5,3]);ctx.strokeRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);ctx.setLineDash([]);
    ctx.shadowBlur=0;ctx.fillStyle='#ffd700';ctx.font='bold 13px Arial';ctx.textAlign='center';
    ctx.fillText('🏁',GOAL.x+GOAL.w/2,GOAL.y+GOAL.h/2-5);ctx.fillText('GOAL',GOAL.x+GOAL.w/2,GOAL.y+GOAL.h/2+11);
  }
  ctx.restore();
}
function drawCar(c){
  if(c.finished){ctx.save();ctx.globalAlpha=0.3;ctx.translate(c.x,c.y);ctx.rotate(c.angle);drawBody(c.color,.8);ctx.restore();return;}
  ctx.save();ctx.shadowBlur=0;
  for(let i=0;i<c.trail.length;i++){
    const a=(i/c.trail.length)*.18;const hx=Math.floor(a*255).toString(16).padStart(2,'0');
    ctx.fillStyle=c.color+hx;ctx.beginPath();ctx.arc(c.trail[i].x,c.trail[i].y,2*(i/c.trail.length),0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  ctx.save();ctx.shadowColor=c.color;ctx.shadowBlur=9;ctx.strokeStyle=c.color+'55';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(c.x,c.y,CAR_R+1.5,0,Math.PI*2);ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);drawBody(c.color,.8);ctx.restore();
}
function drawBody(color,sc){
  const s=sc,W2=15*s,H2=8.5*s;
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(.8*s,1.5*s,W2*.86,H2*.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-W2,-H2,W2*2,H2*2,3.5*s);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.roundRect(-W2+2*s,-H2+2*s,W2*1.05,H2*.86,3*s);ctx.fill();
  ctx.fillStyle='rgba(10,20,45,0.80)';ctx.beginPath();ctx.roundRect(-4*s,-H2+2.5*s,9*s,H2*2-5*s,3*s);ctx.fill();
  ctx.fillStyle=lighten(color,-28);ctx.fillRect(W2-3*s,-H2+1*s,3.5*s,H2*2-2*s);
  ctx.fillStyle=lighten(color,-40);ctx.fillRect(-W2-1.5*s,-H2+2*s,2.5*s,H2*2-4*s);
  ctx.fillStyle='#fffde7';ctx.shadowColor='#fff8e1';ctx.shadowBlur=4*s;
  ctx.beginPath();ctx.arc(W2-1*s,-H2+2*s,1.8*s,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(W2-1*s,H2-2*s,1.8*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff1744';ctx.shadowColor='#ff1744';ctx.shadowBlur=4*s;
  ctx.beginPath();ctx.arc(-W2+1*s,-H2+2*s,1.5*s,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(-W2+1*s,H2-2*s,1.5*s,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
}

function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a0f1a';ctx.fillRect(0,0,W,H);
  drawMaze();drawFlood();drawGoal();drawParticles();cars.forEach(drawCar);
}
function loop(ts){
  if(gameOver)return;
  const dt=Math.min(ts-lastTime,50);lastTime=ts;
  update(dt);draw();
  animId=requestAnimationFrame(loop);
}

function initGame(){buildMaze();placeGoal();spawnCars();}

function startGame(){
  const v=parseInt(document.getElementById('carCount').value)||10;
  if(v<3||v>90){alert('3~90 사이로 입력해주세요!');return;}
  gameOver=false;gameStarted=true;floodActive=false;
  confetti=[];confCtx.clearRect(0,0,W,H);fCtx.clearRect(0,0,W,H);
  document.getElementById('startScreen').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('rankBar').style.display='flex';
  document.getElementById('overlay').classList.remove('show');
  resize();initGame();
  cancelAnimationFrame(animId);lastTime=performance.now();animId=requestAnimationFrame(loop);
}
function showStart(){
  gameOver=false;gameStarted=false;
  cancelAnimationFrame(animId);
  confetti=[];confCtx.clearRect(0,0,W,H);fCtx.clearRect(0,0,W,H);
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('hud').style.display='none';
  document.getElementById('rankBar').style.display='none';
  document.getElementById('startScreen').style.display='flex';
}
document.getElementById('carCount').addEventListener('keydown',e=>{if(e.key==='Enter')startGame();});
resize();
</script>
