<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Car Race Arena - Sprunki Edition</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0a0f1a;overflow:hidden;font-family:Arial,sans-serif;color:#fff;}
  canvas{display:block;}
  #startScreen{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:rgba(8,12,22,0.97);z-index:30;
  }
  #startScreen h1{font-size:40px;color:#e94560;text-shadow:0 0 20px #e94560;margin-bottom:4px;}
  #startScreen .sub{font-size:14px;color:#a29bfe;margin-bottom:8px;letter-spacing:2px;}
  #startScreen p{color:#aaa;margin-bottom:24px;font-size:14px;}
  .input-group{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:24px;}
  .input-group label{font-size:16px;color:#ccc;}
  .input-group input{
    width:120px;padding:10px;text-align:center;font-size:22px;font-weight:bold;
    background:#1e2d3d;border:2px solid #e94560;color:#fff;border-radius:10px;outline:none;
  }
  .hint{font-size:12px;color:#555;}
  #startBtn{padding:13px 50px;background:linear-gradient(135deg,#e94560,#a29bfe);border:none;color:#fff;font-size:18px;border-radius:30px;cursor:pointer;}
  #startBtn:hover{opacity:0.88;}
  #hud{position:fixed;top:0;left:0;right:65px;height:44px;display:none;align-items:center;justify-content:space-between;padding:6px 14px;background:rgba(0,0,0,0.65);backdrop-filter:blur(6px);z-index:10;}
  #hud h1{font-size:16px;color:#e94560;text-shadow:0 0 8px #e94560;white-space:nowrap;}
  #timer{font-size:15px;color:#ffd700;white-space:nowrap;}
  #sidebar{position:fixed;top:0;right:0;width:65px;bottom:0;display:none;flex-direction:column;align-items:center;padding:6px 4px;gap:3px;overflow-y:auto;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);border-left:1px solid rgba(255,255,255,0.07);z-index:10;}
  #sidebar::-webkit-scrollbar{width:2px;}
  #sidebar::-webkit-scrollbar-thumb{background:#333;}
  .sb-title{font-size:9px;color:#555;text-align:center;margin-bottom:2px;letter-spacing:1px;}
  .sb-item{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:5px;font-size:8px;font-weight:bold;border:1px solid transparent;width:56px;overflow:hidden;white-space:nowrap;}
  .sb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  #overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);z-index:20;}
  #overlay.show{display:flex;}
  #winCard{display:flex;flex-direction:column;align-items:center;background:rgba(10,15,30,0.95);border-radius:24px;padding:28px 44px;margin-bottom:20px;border:2px solid transparent;}
  #winLabel{font-size:13px;letter-spacing:3px;color:#aaa;margin-bottom:10px;text-transform:uppercase;}
  #winCanvas{border-radius:16px;margin-bottom:14px;image-rendering:pixelated;}
  #msg{font-size:34px;font-weight:bold;text-shadow:0 0 24px currentColor;margin-bottom:4px;text-align:center;}
  #submsg{font-size:14px;color:#aaa;text-align:center;}
  #restartBtn{padding:12px 40px;background:linear-gradient(135deg,#e94560,#a29bfe);border:none;color:#fff;font-size:17px;border-radius:30px;cursor:pointer;margin-top:20px;}
  #restartBtn:hover{opacity:0.88;}
</style>
</head>
<body>
<div id="startScreen">
  <h1>🏁 Car Race Arena</h1>
  <div class="sub">✨ SPRUNKI EDITION ✨</div>
  <p>스프런키들의 미로 레이싱!</p>
  <div class="input-group">
    <label>자동차 대수</label>
    <input type="number" id="carCount" value="6" min="1" max="30">
    <span class="hint">1 ~ 30대</span>
  </div>
  <button id="startBtn" onclick="startGame()">게임 시작 🚗</button>
</div>
<div id="hud"><h1>🏁 Sprunki Race</h1><div id="timer">⏱ 5.0s</div></div>
<div id="sidebar"></div>
<canvas id="c"></canvas>
<div id="overlay">
  <div id="winCard">
    <div id="winLabel">🏆 우승자</div>
    <canvas id="winCanvas" width="180" height="200"></canvas>
    <div id="msg"></div>
    <div id="submsg"></div>
  </div>
  <button id="restartBtn" onclick="showStart()">다시 시작</button>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
const SIDEBAR_W=65,HUD_H=44;

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
window.addEventListener('resize',()=>{resize();if(gameStarted&&!gameOver){buildMaze();placeGoal();spawnCars();}});

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.arcTo(x+w,y,x+w,y+r,r);
    this.lineTo(x+w,y+h-r);this.arcTo(x+w,y+h,x+w-r,y+h,r);
    this.lineTo(x+r,y+h);this.arcTo(x,y+h,x,y+h-r,r);
    this.lineTo(x,y+r);this.arcTo(x,y,x+r,y,r);this.closePath();
  };
}

// ── Sprunki character definitions (30 characters) ────────────────────────────
const SPRUNKI = [
  {name:'Raddy',   color:'#e82020'},
  {name:'Oren',    color:'#ff8c00'},
  {name:'Simon',   color:'#f5d000'},
  {name:'OWAKCX',  color:'#4caf50'},
  {name:'Vineria', color:'#2e7d32'},
  {name:'Sky',     color:'#4dd0e1'},
  {name:'Jevin',   color:'#1a237e'},
  {name:'Durple',  color:'#8e24aa'},
  {name:'Pinki',   color:'#f06292'},
  {name:'Wenda',   color:'#eeeeee'},
  {name:'Gray',    color:'#78909c'},
  {name:'Black',   color:'#212121'},
  {name:'Brud',    color:'#6d4c41'},
  {name:'Tunner',  color:'#bcaaa4'},
  {name:'Garnold', color:'#f9a825'},
  {name:'Clukr',   color:'#9e9e9e'},
  {name:'Funbot',  color:'#bdbdbd'},
  // 추가 13개 캐릭터 (30대 지원)
  {name:'Blazer',  color:'#ff5722'},
  {name:'Frostie', color:'#80d8ff'},
  {name:'Neon',    color:'#76ff03'},
  {name:'Mystic',  color:'#ce93d8'},
  {name:'Cobalt',  color:'#1565c0'},
  {name:'Amber',   color:'#ffb300'},
  {name:'Crimson', color:'#c62828'},
  {name:'Teal',    color:'#00897b'},
  {name:'Coral',   color:'#ff7043'},
  {name:'Indigo',  color:'#3949ab'},
  {name:'Lime',    color:'#c6ef00'},
  {name:'Rose',    color:'#e91e63'},
  {name:'Copper',  color:'#bf6b00'},
];

// ── Draw each Sprunki ─────────────────────────────────────────────────────────
function drawSprunkiHead(c, x, y, size, ctx2){
  const k=ctx2||ctx;
  const s=size/60;
  k.save();
  k.translate(x,y);

  switch(c.name){
    case 'Raddy': {
      k.fillStyle='#e82020';
      k.beginPath();k.ellipse(0,0,22*s,26*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#e82020';
      for(let i=0;i<5;i++){
        const a=-Math.PI/2+((i-2)*0.38);
        k.save();k.translate(Math.cos(a)*19*s,Math.sin(a)*19*s);k.rotate(a+Math.PI/2);
        k.beginPath();k.moveTo(0,0);k.lineTo(-5*s,-14*s);k.lineTo(5*s,-14*s);k.closePath();k.fill();k.restore();
      }
      k.fillStyle='#fff';
      k.beginPath();k.ellipse(-7*s,-1*s,7*s,7*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-1*s,7*s,7*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#111';
      k.beginPath();k.ellipse(-7*s,-1*s,5*s,5*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-1*s,5*s,5*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#e82020';
      k.beginPath();k.rect(-15*s,-9*s,30*s,8*s);k.fill();
      k.beginPath();k.ellipse(-7*s,-1*s,7.5*s,4*s,0,Math.PI,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-1*s,7.5*s,4*s,0,Math.PI,Math.PI*2);k.fill();
      k.strokeStyle='#111';k.lineWidth=2*s;k.lineCap='round';
      k.beginPath();k.arc(0,12*s,5*s,Math.PI+0.3,-0.3,true);k.stroke();
      break;
    }
    case 'Oren': {
      k.fillStyle='#ff8c00';
      k.beginPath();k.ellipse(0,0,22*s,24*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#d97000';
      k.beginPath();k.moveTo(-4*s,-22*s);k.lineTo(0,-34*s);k.lineTo(4*s,-22*s);k.closePath();k.fill();
      k.strokeStyle='#ff8c00';k.lineWidth=3*s;k.lineCap='round';
      k.beginPath();k.moveTo(-8*s,-22*s);k.lineTo(-16*s,-36*s);k.stroke();
      k.beginPath();k.moveTo(8*s,-22*s);k.lineTo(16*s,-36*s);k.stroke();
      k.fillStyle='#ff8c00';
      k.beginPath();k.arc(-16*s,-37*s,4*s,0,Math.PI*2);k.fill();
      k.beginPath();k.arc(16*s,-37*s,4*s,0,Math.PI*2);k.fill();
      k.strokeStyle='#f0c060';k.lineWidth=5*s;
      k.beginPath();k.arc(0,-5*s,24*s,Math.PI+0.2,-0.2,false);k.stroke();
      k.fillStyle='#f0c060';
      k.beginPath();k.ellipse(-23*s,-5*s,6*s,8*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(23*s,-5*s,6*s,8*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#fff';
      k.beginPath();k.ellipse(-7*s,0,7*s,7*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,0,7*s,7*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#111';
      k.beginPath();k.ellipse(-7*s,1*s,5*s,5*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,1*s,5*s,5*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#ff8c00';
      k.beginPath();k.ellipse(-7*s,-2*s,7.5*s,4.5*s,0,Math.PI,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-2*s,7.5*s,4.5*s,0,Math.PI,Math.PI*2);k.fill();
      k.strokeStyle='#111';k.lineWidth=2*s;
      k.beginPath();k.arc(0,12*s,5*s,0.2,Math.PI-0.2);k.stroke();
      break;
    }
    case 'Simon': {
      k.fillStyle='#f5d000';
      k.beginPath();k.ellipse(0,0,22*s,24*s,0,0,Math.PI*2);k.fill();
      k.strokeStyle='#f5d000';k.lineWidth=3*s;
      k.beginPath();k.moveTo(-7*s,-23*s);k.lineTo(-7*s,-38*s);k.stroke();
      k.beginPath();k.moveTo(7*s,-23*s);k.lineTo(7*s,-38*s);k.stroke();
      k.fillStyle='#f5aa00';
      k.beginPath();k.arc(-7*s,-40*s,5*s,0,Math.PI*2);k.fill();
      k.beginPath();k.arc(7*s,-40*s,5*s,0,Math.PI*2);k.fill();
      k.fillStyle='#fff';
      k.beginPath();k.ellipse(-7*s,-1*s,8*s,9*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-1*s,8*s,9*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#111';
      k.beginPath();k.ellipse(-7*s,-1*s,6*s,6*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-1*s,6*s,6*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#f5d000';
      k.beginPath();k.ellipse(-7*s,-4*s,8.5*s,5*s,0,Math.PI,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-4*s,8.5*s,5*s,0,Math.PI,Math.PI*2);k.fill();
      k.strokeStyle='#111';k.lineWidth=2*s;
      k.beginPath();k.arc(0,12*s,4*s,0.3,Math.PI-0.3);k.stroke();
      break;
    }
    case 'OWAKCX': {
      k.fillStyle='#4caf50';
      k.beginPath();k.ellipse(0,0,22*s,24*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#388e3c';
      [-20,-12,0,12,20].forEach((px,i)=>{
        k.beginPath();k.moveTo(px*s,-20*s);k.lineTo((px-5)*s,-32*s-(i%2)*8*s);k.lineTo((px+5)*s,-32*s-(i%2)*8*s);k.closePath();k.fill();
      });
      k.fillStyle='#fff';
      k.beginPath();k.ellipse(-8*s,-1*s,7*s,8*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(8*s,-1*s,6*s,7*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#111';
      k.beginPath();k.ellipse(-8*s,-1*s,5*s,5*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(8*s,0,4*s,4*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#4caf50';
      k.beginPath();k.ellipse(-8*s,-4*s,7.5*s,4.5*s,0,Math.PI,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(8*s,-3*s,6.5*s,4*s,0,Math.PI,Math.PI*2);k.fill();
      k.strokeStyle='#111';k.lineWidth=2*s;
      k.beginPath();k.moveTo(-5*s,12*s);k.lineTo(5*s,12*s);k.stroke();
      break;
    }
    case 'Vineria': {
      k.fillStyle='#2e7d32';
      k.beginPath();k.ellipse(0,0,22*s,24*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#1b5e20';
      k.beginPath();k.ellipse(0,-20*s,26*s,20*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#2e7d32';
      k.beginPath();k.ellipse(-8*s,-10*s,8*s,10*s,0.3,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(8*s,-10*s,8*s,10*s,-0.3,0,Math.PI*2);k.fill();
      ['#ff80ab','#f48fb1','#f8bbd0'].forEach((fc,i)=>{
        const fx=(-12+i*12)*s,fy=-32*s;
        k.fillStyle=fc;
        for(let p=0;p<5;p++){const pa=p*Math.PI*2/5;k.beginPath();k.ellipse(fx+Math.cos(pa)*5*s,fy+Math.sin(pa)*5*s,3.5*s,3.5*s,0,0,Math.PI*2);k.fill();}
        k.fillStyle='#fff176';k.beginPath();k.arc(fx,fy,3*s,0,Math.PI*2);k.fill();
      });
      k.fillStyle='#fff';
      k.beginPath();k.ellipse(-7*s,-1*s,7*s,7*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-1*s,7*s,7*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#111';
      k.beginPath();k.ellipse(-7*s,-1*s,5*s,5*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-1*s,5*s,5*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#2e7d32';
      k.beginPath();k.ellipse(-7*s,-4*s,7.5*s,4*s,0,Math.PI,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-4*s,7.5*s,4*s,0,Math.PI,Math.PI*2);k.fill();
      k.strokeStyle='#111';k.lineWidth=1.5*s;
      k.beginPath();k.arc(0,12*s,5*s,0.3,Math.PI-0.3);k.stroke();
      break;
    }
    case 'Sky': {
      k.fillStyle='#4dd0e1';
      k.beginPath();k.ellipse(0,0,22*s,24*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.arc(-18*s,-18*s,9*s,0,Math.PI*2);k.fill();
      k.beginPath();k.arc(18*s,-18*s,9*s,0,Math.PI*2);k.fill();
      k.fillStyle='#80deea';
      k.beginPath();k.arc(-18*s,-18*s,5*s,0,Math.PI*2);k.fill();
      k.beginPath();k.arc(18*s,-18*s,5*s,0,Math.PI*2);k.fill();
      k.fillStyle='#fff';
      k.beginPath();k.ellipse(-7*s,-1*s,7*s,7*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-1*s,7*s,7*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#111';
      k.beginPath();k.ellipse(-7*s,-1*s,5*s,5*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-1*s,5*s,5*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#4dd0e1';
      k.beginPath();k.ellipse(-7*s,-4*s,7.5*s,4*s,0,Math.PI,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-4*s,7.5*s,4*s,0,Math.PI,Math.PI*2);k.fill();
      k.strokeStyle='#111';k.lineWidth=2*s;
      k.beginPath();k.arc(0,12*s,5*s,0.2,Math.PI-0.2);k.stroke();
      break;
    }
    case 'Jevin': {
      k.fillStyle='#1a237e';
      k.beginPath();k.ellipse(0,0,24*s,28*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#0d1757';
      k.beginPath();k.ellipse(0,-8*s,22*s,18*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#1a237e';
      k.beginPath();k.ellipse(0,2*s,16*s,16*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#fff';
      k.beginPath();k.ellipse(-6*s,0,7*s,7*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(6*s,0,7*s,7*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#111';
      k.beginPath();k.ellipse(-6*s,0,5*s,5*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(6*s,0,5*s,5*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#1a237e';
      k.beginPath();k.ellipse(-6*s,-3*s,7.5*s,4.5*s,0,Math.PI,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(6*s,-3*s,7.5*s,4.5*s,0,Math.PI,Math.PI*2);k.fill();
      k.strokeStyle='#111';k.lineWidth=2*s;
      k.beginPath();k.moveTo(-4*s,10*s);k.lineTo(4*s,10*s);k.stroke();
      break;
    }
    case 'Durple': {
      k.fillStyle='#8e24aa';
      k.beginPath();k.ellipse(0,0,22*s,24*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#7b1fa2';
      k.beginPath();k.moveTo(-5*s,-22*s);k.lineTo(0,-38*s);k.lineTo(5*s,-22*s);k.closePath();k.fill();
      k.beginPath();k.moveTo(-22*s,-5*s);k.lineTo(-38*s,-14*s);k.lineTo(-22*s,5*s);k.closePath();k.fill();
      k.beginPath();k.moveTo(22*s,-5*s);k.lineTo(38*s,-14*s);k.lineTo(22*s,5*s);k.closePath();k.fill();
      k.fillStyle='#fff';
      k.beginPath();k.ellipse(-7*s,-1*s,7*s,8*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-1*s,7*s,8*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#111';
      k.beginPath();k.ellipse(-7*s,-1*s,5*s,6*s,0,0,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-1*s,5*s,6*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#8e24aa';
      k.beginPath();k.ellipse(-7*s,-4*s,7.5*s,4.5*s,0,Math.PI,Math.PI*2);k.fill();
      k.beginPath();k.ellipse(7*s,-4*s,7.5*s,4.5*s,0,Math.PI,Math.PI*2);k.fill();
      k.strokeStyle='#111';k.lineWidth=2*s;
      k.beginPath();k.moveTo(-5*s,12*s);k.lineTo(5*s,12*s);k.stroke();
      break;
    }
    case 'Pinki': {
      k.fillStyle='#f06292';
      k.beginPath();k.ellipse(0,0,22*s,24*s,0,0,Math.PI*2);k.fill();
      k.fillStyle='#f06292';
      k.beginPath();k.ellipse(-12*s,-30*s,7*s,18*s,0,0,Math.PI*2);k.fill();

// ── Physics ───────────────────────────────────────────────────────────────────
const SPEED=1.6,RESTITUTION=0.82,WALL_REST=0.78,FRICTION=0.9985,MIN_SPEED=1.2,MAX_SPEED=3.5;

// ── Maze ──────────────────────────────────────────────────────────────────────
const CELL=52;
let walls=[],COLS,ROWS,mazeOX,mazeOY;
function buildMaze(){
  const usableW=W-SIDEBAR_W;
  COLS=Math.floor(usableW/CELL);ROWS=Math.floor((H-HUD_H)/CELL);
  mazeOX=(usableW-COLS*CELL)/2;mazeOY=HUD_H+(H-HUD_H-ROWS*CELL)/2;
  walls=[];
  const cw=Array.from({length:ROWS},()=>Array(COLS).fill(3));
  const vis=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  const stack=[{r:0,c:0}];vis[0][0]=true;
  while(stack.length){
    const {r,c}=stack[stack.length-1];
    const nbrs=shuffle([[0,1],[0,-1],[1,0],[-1,0]])
      .map(([dr,dc])=>({dr,dc,nr:r+dr,nc:c+dc}))
      .filter(({nr,nc})=>nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!vis[nr][nc]);
    if(!nbrs.length){stack.pop();continue;}
    const {dr,dc,nr,nc}=nbrs[0];
    vis[nr][nc]=true;
    if(dr===0&&dc===1)cw[r][c]&=~1;if(dr===0&&dc===-1)cw[r][nc]&=~1;
    if(dr===1&&dc===0)cw[r][c]&=~2;if(dr===-1&&dc===0)cw[nr][nc]&=~2;
    stack.push({r:nr,c:nc});
  }
  function addWall(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);if(len<0.01)return;walls.push({x1,y1,x2,y2,nx:-dy/len,ny:dx/len,len});}
  addWall(mazeOX,mazeOY,mazeOX+COLS*CELL,mazeOY);
  addWall(mazeOX,mazeOY+ROWS*CELL,mazeOX+COLS*CELL,mazeOY+ROWS*CELL);
  addWall(mazeOX,mazeOY,mazeOX,mazeOY+ROWS*CELL);
  addWall(mazeOX+COLS*CELL,mazeOY,mazeOX+COLS*CELL,mazeOY+ROWS*CELL);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=mazeOX+c*CELL,y=mazeOY+r*CELL;
    if(cw[r][c]&1)addWall(x+CELL,y,x+CELL,y+CELL);
    if(cw[r][c]&2)addWall(x,y+CELL,x+CELL,y+CELL);
  }
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

let GOAL={},goalActive=false,goalTimer=0;
const GOAL_DELAY=5000;
function placeGoal(){GOAL={x:mazeOX+(COLS-1)*CELL+5,y:mazeOY+(ROWS-1)*CELL+5,w:CELL-10,h:CELL-10};goalActive=false;goalTimer=0;}

// ── Car top-down drawing ──────────────────────────────────────────────────────
function lighten(hex,amt){
  let r=parseInt(hex.slice(1,3),16)||0,g=parseInt(hex.slice(3,5),16)||0,b=parseInt(hex.slice(5,7),16)||0;
  r=Math.max(0,Math.min(255,r+amt));g=Math.max(0,Math.min(255,g+amt));b=Math.max(0,Math.min(255,b+amt));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.ellipse(0,0,w,h,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle=bodyColor;ctx.beginPath();ctx.ellipse(0,0,w*.25,h*.25,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

  ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-W2,-H2,W2*2,H2*2,4*s);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.beginPath();ctx.roundRect(-W2+2*s,-H2+2*s,W2*1.1,H2*.9,3*s);ctx.fill();
  ctx.fillStyle='rgba(20,30,50,0.85)';ctx.beginPath();ctx.roundRect(-4*s,-H2+2.5*s,10*s,H2*2-5*s,3*s);ctx.fill();
  ctx.fillStyle=lighten(color,-30);ctx.fillRect(W2-3*s,-H2+1*s,4*s,H2*2-2*s);
  ctx.fillStyle=lighten(color,-40);ctx.fillRect(-W2-2*s,-H2+2*s,3*s,H2*2-4*s);
  ctx.fillStyle='#fffde7';ctx.shadowColor='#fff8e1';ctx.shadowBlur=6*s;
  ctx.beginPath();ctx.arc(W2-1*s,-H2+2*s,2*s,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(W2-1*s,H2-2*s,2*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff1744';ctx.shadowColor='#ff1744';ctx.shadowBlur=5*s;
  ctx.beginPath();ctx.arc(-W2+1*s,-H2+2*s,1.8*s,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(-W2+1*s,H2-2*s,1.8*s,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  drawTopdownWheel(W2-2*s,-H2-2*s,4*s,2.5*s,color);
  drawTopdownWheel(W2-2*s,H2+2*s,4*s,2.5*s,color);
  drawTopdownWheel(-W2+2*s,-H2-2*s,4*s,2.5*s,color);
  drawTopdownWheel(-W2+2*s,H2+2*s,4*s,2.5*s,color);
}

// ── Cars ──────────────────────────────────────────────────────────────────────
const CAR_R=13;
let cars=[],particles=[],gameOver=false,gameStarted=false,animId,lastTime=0;

function spawnCars(){
  const count=Math.min(Math.max(parseInt(document.getElementById('carCount').value)||6,1),30);
  cars=[];
  // 30대 지원: SPRUNKI 배열을 반복 사용 (색상 변형 포함)
  const chars=[];
  const base=shuffle([...SPRUNKI]);
  for(let i=0;i<count;i++){
    const orig=base[i%base.length];
    if(i<base.length){
      chars.push({...orig});
    } else {
      // 중복 시 이름에 번호 붙이고 색상 약간 변형
      const variant=Math.floor(i/base.length);
      chars.push({name:orig.name+(variant+2), color:lighten(orig.color,(variant%2===0?40:-40))});
    }
  }
  const maxC=Math.ceil(COLS/2),maxR=Math.ceil(ROWS/2);
  const pool=[];
  for(let r=0;r<maxR;r++)for(let c=0;c<maxC;c++)pool.push([r,c]);
  shuffle(pool);
  for(let i=0;i<count;i++){
    const [r,c]=pool[i%pool.length];
    const ang=Math.random()*Math.PI*2;
    const ch=chars[i];
    cars.push({
      name:ch.name,color:ch.color,
      x:mazeOX+c*CELL+CELL/2+(Math.random()-.5)*8,
      y:mazeOY+r*CELL+CELL/2+(Math.random()-.5)*8,
      vx:Math.cos(ang)*SPEED,vy:Math.sin(ang)*SPEED,
      omega:0,angle:ang,trail:[],alive:true,spinDecay:0.85
    });
  }
  particles=[];buildSidebar();
}

function buildSidebar(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML='<div class="sb-title">RACERS</div>';
  for(const c of cars){
    const div=document.createElement('div');div.className='sb-item';
    div.style.cssText='background:'+c.color+'18;border-color:'+c.color+'55;color:'+(c.name.startsWith('Wenda')||c.name.startsWith('Black')?'#aaa':c.color);
    div.innerHTML='<span class="sb-dot" style="background:'+c.color+'"></span>'+c.name;
    sb.appendChild(div);
  }
}

// ── Particles ─────────────────────────────────────────────────────────────────
function spawnImpact(x,y,vx,vy,color,intensity){
  intensity=intensity||1;
  for(let i=0;i<Math.floor(8+intensity*10);i++){
    const spd=(1.5+Math.random()*3)*intensity;
    const ang=Math.atan2(vy,vx)+Math.PI+(Math.random()-.5)*Math.PI*1.8;
    particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:1,decay:.04+Math.random()*.04,r:1.5+Math.random()*3,color,sw:false});
  }
  particles.push({x,y,sw:true,r:3,life:1,decay:.06+intensity*.02,color,lw:1.5+intensity});
  for(let i=0;i<4;i++){const a=Math.random()*Math.PI*2,sp=2+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.07+Math.random()*.05,r:1.5,color:'#ffe066',sw:false});}
}
function updateParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=p.decay;if(p.life<=0){particles.splice(i,1);continue;}if(p.sw){p.r+=3;continue;}p.x+=p.vx;p.y+=p.vy;p.vx*=.88;p.vy*=.88;}}
function drawParticles(){ctx.save();ctx.shadowBlur=0;for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);if(p.sw){ctx.strokeStyle=p.color;ctx.lineWidth=p.lw||2;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();}else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}}ctx.globalAlpha=1;ctx.restore();}

// ── Physics ───────────────────────────────────────────────────────────────────
function enforceSpeed(c){const s=Math.sqrt(c.vx*c.vx+c.vy*c.vy);if(s>.01){if(s<MIN_SPEED){c.vx=c.vx/s*MIN_SPEED;c.vy=c.vy/s*MIN_SPEED;}else if(s>MAX_SPEED){c.vx=c.vx/s*MAX_SPEED;c.vy=c.vy/s*MAX_SPEED;}}}
function resolveWall(car){for(const w of walls){const{x1,y1,x2,y2,nx,ny,len}=w;const dx=car.x-x1,dy=car.y-y1;const dist=dx*nx+dy*ny;if(dist>CAR_R||dist<-CAR_R)continue;const wx=x2-x1,wy=y2-y1;const t=(dx*wx+dy*wy)/(len*len);if(t<-.01||t>1.01)continue;if(Math.abs(dist)<CAR_R){const pen=CAR_R-Math.abs(dist),sg=dist<0?-1:1;car.x+=nx*pen*sg;car.y+=ny*pen*sg;const vn=car.vx*nx+car.vy*ny;if(vn*sg>0)continue;const j=-(1+WALL_REST)*vn;car.vx+=j*nx;car.vy+=j*ny;const tx=-ny,ty=nx,vt=car.vx*tx+car.vy*ty;car.vx-=.08*vt*tx;car.vy-=.08*vt*ty;car.omega=vt*.04;spawnImpact(car.x,car.y,car.vx,car.vy,car.color,Math.min(Math.sqrt(car.vx*car.vx+car.vy*car.vy)/SPEED,2));enforceSpeed(car);}}}
function resolveCarCar(a,b){const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist===0||dist>=CAR_R*2)return;const nx=dx/dist,ny=dy/dist;const ov=(CAR_R*2-dist)/2+.5;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;const rvx=a.vx-b.vx,rvy=a.vy-b.vy,vRel=rvx*nx+rvy*ny;if(vRel<=0)return;const j=-(1+RESTITUTION)*vRel*.5;a.vx+=j*nx;a.vy+=j*ny;b.vx-=j*nx;b.vy-=j*ny;const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty;a.omega+=vt*.05;b.omega-=vt*.05;a.vx-=.06*vt*tx;a.vy-=.06*vt*ty;b.vx+=.06*vt*tx;b.vy+=.06*vt*ty;enforceSpeed(a);enforceSpeed(b);const ix=(a.x+b.x)/2,iy=(a.y+b.y)/2;spawnImpact(ix,iy,rvx,rvy,'#fff',Math.min(Math.abs(vRel)/SPEED*.8+.3,2.5));spawnImpact(ix,iy,a.vx,a.vy,a.color,.4);spawnImpact(ix,iy,b.vx,b.vy,b.color,.4);}

// ── Win face ──────────────────────────────────────────────────────────────────
function drawWinFace(ch){
  const wc=document.getElementById('winCanvas');
  const wctx=wc.getContext('2d');
  const S=180,H=200;
  wc.width=S;wc.height=H;
  wctx.clearRect(0,0,S,H);
  const bg=wctx.createRadialGradient(S/2,H/2,5,S/2,H/2,90);
  bg.addColorStop(0,ch.color+'44');bg.addColorStop(1,'#0a0f1a');
  wctx.fillStyle=bg;wctx.fillRect(0,0,S,H);
  wctx.save();wctx.shadowColor=ch.color;wctx.shadowBlur=20;
  wctx.strokeStyle=ch.color;wctx.lineWidth=3;
  wctx.beginPath();wctx.arc(S/2,H/2-10,78,0,Math.PI*2);wctx.stroke();
  wctx.restore();
  drawSprunkiHead(ch,S/2,H/2-10,72,wctx);
  wctx.fillStyle='#ffd700';wctx.font='16px Arial';wctx.textAlign='center';
  wctx.fillText('✦',16,18);wctx.fillText('✦',S-16,18);
  wctx.fillText('✦',16,H-10);wctx.fillText('✦',S-16,H-10);
  document.getElementById('winCard').style.borderColor=ch.color;
  document.getElementById('winCard').style.boxShadow='0 0 50px '+ch.color+'55';
}

// ── Update ────────────────────────────────────────────────────────────────────
function update(dt){
  if(!goalActive){goalTimer+=dt;if(goalTimer>=GOAL_DELAY)goalActive=true;}
  updateParticles();
  for(const c of cars){
    if(!c.alive)continue;
    c.trail.push({x:c.x,y:c.y});if(c.trail.length>16)c.trail.shift();
    c.x+=c.vx;c.y+=c.vy;c.vx*=FRICTION;c.vy*=FRICTION;
    c.angle+=c.omega;c.omega*=c.spinDecay;
    if(Math.abs(c.omega)<.025){let da=Math.atan2(c.vy,c.vx)-c.angle;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;c.angle+=da*.2;}
    enforceSpeed(c);resolveWall(c);
  }
  for(let iter=0;iter<2;iter++)for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++)if(cars[i].alive&&cars[j].alive)resolveCarCar(cars[i],cars[j]);
  if(goalActive){
    for(const c of cars){
      if(!c.alive)continue;
      if(c.x>GOAL.x&&c.x<GOAL.x+GOAL.w&&c.y>GOAL.y&&c.y<GOAL.y+GOAL.h){
        gameOver=true;draw();
        const ch=SPRUNKI.find(s=>s.name===c.name)||{name:c.name,color:c.color};
        drawWinFace(ch);
        document.getElementById('msg').style.color=c.color;
        document.getElementById('msg').textContent='🏆 '+c.name+' 우승!';
        document.getElementById('submsg').textContent='Sprunki 레이싱 챔피언 🎉';
        document.getElementById('overlay').classList.add('show');return;
      }
    }
  }
  const remain=Math.max(0,(GOAL_DELAY-goalTimer)/1000);
  document.getElementById('timer').textContent=goalActive?'🏁 GOAL 활성!':'⏱ '+remain.toFixed(1)+'s';
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function drawMaze(){ctx.save();ctx.strokeStyle='#2a9d8f';ctx.lineWidth=2.5;ctx.shadowColor='#2a9d8f';ctx.shadowBlur=6;for(const w of walls){ctx.beginPath();ctx.moveTo(w.x1,w.y1);ctx.lineTo(w.x2,w.y2);ctx.stroke();}ctx.restore();}
function drawGoal(){
  const pulse=Math.sin(Date.now()/180)*.15;ctx.save();
  if(!goalActive){const rem=Math.max(0,(GOAL_DELAY-goalTimer)/1000);ctx.fillStyle='rgba(80,80,80,'+(0.22+Math.abs(pulse))+')';ctx.fillRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.strokeRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);ctx.setLineDash([]);ctx.fillStyle='#777';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText('🔒',GOAL.x+GOAL.w/2,GOAL.y+GOAL.h/2-4);ctx.fillText(rem.toFixed(1)+'s',GOAL.x+GOAL.w/2,GOAL.y+GOAL.h/2+10);}
  else{ctx.shadowColor='#ffd700';ctx.shadowBlur=28;ctx.fillStyle='rgba(255,215,0,'+(0.28+pulse)+')';ctx.fillRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.setLineDash([5,3]);ctx.strokeRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);ctx.setLineDash([]);ctx.shadowBlur=0;ctx.fillStyle='#ffd700';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('🏁',GOAL.x+GOAL.w/2,GOAL.y+GOAL.h/2-4);ctx.fillText('GOAL',GOAL.x+GOAL.w/2,GOAL.y+GOAL.h/2+10);}
  ctx.restore();
}
function drawGameCar(c){
  ctx.save();ctx.shadowBlur=0;
  for(let i=0;i<c.trail.length;i++){const a=(i/c.trail.length)*.18;const hex=Math.floor(a*255).toString(16).padStart(2,'0');ctx.fillStyle=c.color+hex;ctx.beginPath();ctx.arc(c.trail[i].x,c.trail[i].y,2.5*(i/c.trail.length),0,Math.PI*2);ctx.fill();}
  ctx.restore();
  ctx.save();ctx.shadowColor=c.color;ctx.shadowBlur=10;ctx.strokeStyle=c.color+'66';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(c.x,c.y,CAR_R+2,0,Math.PI*2);ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);drawCarBody(c.color,.75);ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a0f1a';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;ctx.shadowBlur=0;
  for(let x=0;x<W-SIDEBAR_W;x+=CELL){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=CELL){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W-SIDEBAR_W,y);ctx.stroke();}
  ctx.restore();
  drawMaze();drawGoal();drawParticles();cars.forEach(drawGameCar);
}
function loop(ts){if(gameOver)return;const dt=Math.min(ts-lastTime,50);lastTime=ts;update(dt);draw();animId=requestAnimationFrame(loop);}

function startGame(){
  const v=parseInt(document.getElementById('carCount').value)||6;
  if(v<1||v>30){alert('1~30 사이로 입력해주세요!');return;}
  gameOver=false;gameStarted=true;
  document.getElementById('startScreen').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('sidebar').style.display='flex';
  document.getElementById('overlay').classList.remove('show');
  resize();buildMaze();placeGoal();spawnCars();
  cancelAnimationFrame(animId);lastTime=performance.now();animId=requestAnimationFrame(loop);
}
function showStart(){
  gameOver=false;gameStarted=false;cancelAnimationFrame(animId);
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('hud').style.display='none';
  document.getElementById('sidebar').style.display='none';
  document.getElementById('startScreen').style.display='flex';
}
document.getElementById('carCount').addEventListener('keydown',e=>{if(e.key==='Enter')startGame();});
resize();
</script>
