<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Car Race Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0f1a;overflow:hidden;font-family:Arial,sans-serif;color:#fff;}
canvas{display:block;}

#startScreen{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(8,12,22,0.97);z-index:30;padding:16px;
}
#startScreen h1{font-size:min(9vw,42px);color:#e94560;text-shadow:0 0 20px #e94560;margin-bottom:4px;}
#startScreen .sub{font-size:min(4vw,18px);color:#a29bfe;margin-bottom:6px;letter-spacing:2px;}
#startScreen p{color:#ccc;margin-bottom:20px;font-size:min(4vw,17px);}
.input-group{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:20px;}
.input-group label{font-size:min(5vw,21px);color:#fff;font-weight:bold;}
.input-group input{
  width:min(35vw,150px);padding:10px;text-align:center;
  font-size:min(8vw,34px);font-weight:bold;
  background:#1e2d3d;border:3px solid #e94560;color:#fff;border-radius:12px;outline:none;
}
.hint{font-size:min(3.5vw,15px);color:#aaa;}
#startBtn{
  padding:min(3.5vw,15px) min(10vw,48px);
  background:linear-gradient(135deg,#e94560,#a29bfe);
  border:none;color:#fff;font-size:min(5.5vw,22px);
  border-radius:40px;cursor:pointer;font-weight:bold;
}

/* HUD */
#hud{
  position:fixed;top:0;left:0;right:0;height:48px;
  display:none;align-items:center;justify-content:space-between;
  padding:0 12px;background:rgba(0,0,0,0.82);z-index:10;gap:8px;
}
#hud h1{font-size:15px;color:#e94560;text-shadow:0 0 8px #e94560;white-space:nowrap;flex-shrink:0;}
#timer{font-size:15px;color:#ffd700;white-space:nowrap;font-weight:bold;flex-shrink:0;}
#speedWrap{display:flex;align-items:center;gap:6px;flex:1;max-width:200px;}
#speedLabel{font-size:12px;color:#aaa;white-space:nowrap;}
#speedSlider{
  -webkit-appearance:none;appearance:none;
  width:100%;height:6px;border-radius:3px;
  background:linear-gradient(to right,#e94560,#a29bfe);
  outline:none;cursor:pointer;
}
#speedSlider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:18px;height:18px;border-radius:50%;
  background:#fff;border:2px solid #e94560;cursor:pointer;
}
#speedVal{font-size:13px;color:#fff;font-weight:bold;min-width:28px;text-align:right;}

/* 사이드바 제거 → 순위 HUD 하단 */
#rankBar{
  position:fixed;bottom:0;left:0;right:0;height:auto;
  display:none;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:4px;padding:5px 8px;
  background:rgba(0,0,0,0.82);z-index:10;
}
.rk-item{
  display:flex;align-items:center;gap:4px;padding:3px 8px;
  border-radius:20px;font-size:min(2.8vw,12px);font-weight:bold;
  border:1.5px solid transparent;white-space:nowrap;
}
.rk-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* 홍수 캔버스 */
#floodCanvas{position:fixed;top:0;left:0;pointer-events:none;z-index:5;}

/* 결과 오버레이 */
#overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.88);z-index:20;}
#overlay.show{display:flex;}
#podiumWrap{display:flex;align-items:flex-end;gap:10px;margin-bottom:16px;}
.podium-col{display:flex;flex-direction:column;align-items:center;gap:6px;}
.podium-rank{font-size:min(7vw,28px);font-weight:bold;}
.podium-face{border-radius:50%;image-rendering:pixelated;}
.podium-name{font-size:min(3.5vw,14px);font-weight:bold;text-align:center;max-width:80px;}
.podium-block{border-radius:8px 8px 0 0;width:min(18vw,76px);}
#restartBtn{
  padding:12px 40px;background:linear-gradient(135deg,#e94560,#a29bfe);
  border:none;color:#fff;font-size:min(5vw,20px);
  border-radius:30px;cursor:pointer;font-weight:bold;margin-top:4px;
}
#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:19;}
</style>
</head>
<body>
<div id="startScreen">
  <h1>🏁 Car Race Arena</h1>
  <div class="sub">✨ SPRUNKI EDITION ✨</div>
  <p>스프런키들의 미로 레이싱!</p>
  <div class="input-group">
    <label>🚗 자동차 대수</label>
    <input type="number" id="carCount" value="10" min="3" max="30">
    <span class="hint">3 ~ 30대</span>
  </div>
  <button id="startBtn" onclick="startGame()">게임 시작 🚗💨</button>
</div>

<div id="hud">
  <h1>🏁 Race</h1>
  <div id="timer">⏱ 10s</div>
  <div id="speedWrap">
    <span id="speedLabel">⚡속도</span>
    <input type="range" id="speedSlider" min="1" max="10" step="0.5" value="1">
    <span id="speedVal">×1</span>
  </div>
</div>
<canvas id="floodCanvas"></canvas>
<canvas id="c"></canvas>
<div id="rankBar"></div>

<div id="overlay">
  <div style="font-size:min(7vw,30px);color:#ffd700;text-shadow:0 0 20px #ffd700;margin-bottom:16px;font-weight:bold;">🏆 시상대 🏆</div>
  <div id="podiumWrap"></div>
  <button id="restartBtn" onclick="showStart()">다시 시작 🔄</button>
</div>
<canvas id="confettiCanvas"></canvas>

<script>
// ── 캔버스 ────────────────────────────────────────────────────────────────────
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const floodCv=document.getElementById('floodCanvas');
const floodCtx=floodCv.getContext('2d');
const confCv=document.getElementById('confettiCanvas');
const confCtx=confCv.getContext('2d');
let W,H;
const HUD_H=48, RANK_H=36;

function resize(){
  W=canvas.width=floodCv.width=confCv.width=window.innerWidth;
  H=canvas.height=floodCv.height=confCv.height=window.innerHeight;
}
window.addEventListener('resize',()=>{resize();if(gameStarted&&!gameOver){buildMaze();placeGoal();spawnCars();}});

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.arcTo(x+w,y,x+w,y+r,r);
    this.lineTo(x+w,y+h-r);this.arcTo(x+w,y+h,x+w-r,y+h,r);
    this.lineTo(x+r,y+h);this.arcTo(x,y+h,x,y+h-r,r);
    this.lineTo(x,y+r);this.arcTo(x,y,x+r,y,r);this.closePath();
  };
}

// ── 속도 슬라이더 ─────────────────────────────────────────────────────────────
let speedMult=1;
const slider=document.getElementById('speedSlider');
const speedValEl=document.getElementById('speedVal');
slider.addEventListener('input',()=>{
  speedMult=parseFloat(slider.value);
  speedValEl.textContent='×'+speedMult;
});

// ── 캐릭터 ────────────────────────────────────────────────────────────────────
const SPRUNKI=[
  {name:'Raddy',color:'#e82020'},{name:'Oren',color:'#ff8c00'},
  {name:'Simon',color:'#f5d000'},{name:'OWAKCX',color:'#4caf50'},
  {name:'Vineria',color:'#2e7d32'},{name:'Sky',color:'#4dd0e1'},
  {name:'Jevin',color:'#3949ab'},{name:'Durple',color:'#8e24aa'},
  {name:'Pinki',color:'#f06292'},{name:'Wenda',color:'#e0e0e0'},
  {name:'Gray',color:'#78909c'},{name:'Black',color:'#37474f'},
  {name:'Brud',color:'#6d4c41'},{name:'Tunner',color:'#bcaaa4'},
  {name:'Garnold',color:'#f9a825'},{name:'Clukr',color:'#9e9e9e'},
  {name:'Funbot',color:'#00bcd4'},{name:'Blazer',color:'#ff5722'},
  {name:'Frostie',color:'#80d8ff'},{name:'Neon',color:'#aeea00'},
  {name:'Mystic',color:'#ce93d8'},{name:'Cobalt',color:'#1565c0'},
  {name:'Amber',color:'#ffb300'},{name:'Crimson',color:'#c62828'},
  {name:'Teal',color:'#00897b'},{name:'Coral',color:'#ff7043'},
  {name:'Indigo',color:'#5c6bc0'},{name:'Lime',color:'#8bc34a'},
  {name:'Rose',color:'#e91e63'},{name:'Copper',color:'#e65100'},
];

function lighten(hex,amt){
  let r=parseInt(hex.slice(1,3),16)||0,g=parseInt(hex.slice(3,5),16)||0,b=parseInt(hex.slice(5,7),16)||0;
  return '#'+[Math.max(0,Math.min(255,r+amt)),Math.max(0,Math.min(255,g+amt)),Math.max(0,Math.min(255,b+amt))].map(v=>v.toString(16).padStart(2,'0')).join('');
}

// ── 캐릭터 얼굴 그리기 ────────────────────────────────────────────────────────
function drawFace(c,x,y,size,k){
  k=k||ctx; const s=size/60;
  k.save();k.translate(x,y);
  k.fillStyle=c.color;k.beginPath();k.ellipse(0,0,22*s,24*s,0,0,Math.PI*2);k.fill();
  const seed=c.name.charCodeAt(0)%6;
  k.fillStyle=lighten(c.color,-35);
  if(seed===0){for(let i=0;i<3;i++){const a=-Math.PI/2+((i-1)*0.5);k.save();k.translate(Math.cos(a)*19*s,Math.sin(a)*19*s);k.rotate(a+Math.PI/2);k.beginPath();k.moveTo(0,0);k.lineTo(-4*s,-12*s);k.lineTo(4*s,-12*s);k.closePath();k.fill();k.restore();}}
  else if(seed===1){k.strokeStyle=c.color;k.lineWidth=3*s;k.lineCap='round';k.beginPath();k.moveTo(-7*s,-23*s);k.lineTo(-7*s,-36*s);k.stroke();k.beginPath();k.moveTo(7*s,-23*s);k.lineTo(7*s,-36*s);k.stroke();k.fillStyle=lighten(c.color,40);k.beginPath();k.arc(-7*s,-38*s,5*s,0,Math.PI*2);k.fill();k.beginPath();k.arc(7*s,-38*s,5*s,0,Math.PI*2);k.fill();}
  else if(seed===2){k.beginPath();k.arc(-17*s,-17*s,8*s,0,Math.PI*2);k.fill();k.beginPath();k.arc(17*s,-17*s,8*s,0,Math.PI*2);k.fill();}
  else if(seed===3){k.beginPath();k.moveTo(-4*s,-22*s);k.lineTo(0,-36*s);k.lineTo(4*s,-22*s);k.closePath();k.fill();}
  else if(seed===4){k.strokeStyle=c.color;k.lineWidth=4*s;k.beginPath();k.arc(0,-5*s,23*s,Math.PI+0.3,-0.3,false);k.stroke();k.fillStyle=lighten(c.color,30);k.beginPath();k.ellipse(-22*s,-5*s,5*s,7*s,0,0,Math.PI*2);k.fill();k.beginPath();k.ellipse(22*s,-5*s,5*s,7*s,0,0,Math.PI*2);k.fill();}
  else{k.fillStyle=lighten(c.color,30);k.beginPath();k.ellipse(-7*s,-20*s,7*s,4*s,-0.4,0,Math.PI*2);k.fill();k.beginPath();k.ellipse(7*s,-20*s,7*s,4*s,0.4,0,Math.PI*2);k.fill();k.beginPath();k.arc(0,-20*s,3.5*s,0,Math.PI*2);k.fill();}
  // 눈
  k.fillStyle='#fff';k.beginPath();k.ellipse(-7*s,-1*s,7*s,7*s,0,0,Math.PI*2);k.fill();k.beginPath();k.ellipse(7*s,-1*s,7*s,7*s,0,0,Math.PI*2);k.fill();
  k.fillStyle='#111';k.beginPath();k.ellipse(-7*s,-1*s,5*s,5*s,0,0,Math.PI*2);k.fill();k.beginPath();k.ellipse(7*s,-1*s,5*s,5*s,0,0,Math.PI*2);k.fill();
  k.fillStyle=c.color;k.beginPath();k.ellipse(-7*s,-4*s,7.5*s,4*s,0,Math.PI,Math.PI*2);k.fill();k.beginPath();k.ellipse(7*s,-4*s,7.5*s,4*s,0,Math.PI,Math.PI*2);k.fill();
  k.strokeStyle='#111';k.lineWidth=2*s;k.lineCap='round';k.beginPath();k.arc(0,12*s,5*s,0.2,Math.PI-0.2);k.stroke();
  k.restore();
}

// ── 미로 (셀 크기 조정으로 절반 복잡도) ──────────────────────────────────────
const CELL=90; // 크게 → 미로 단순
let walls=[],wallGrid=[],COLS,ROWS,mazeOX,mazeOY;

function buildMaze(){
  const usableW=W, usableH=H-HUD_H-RANK_H;
  COLS=Math.max(3,Math.floor(usableW/CELL));
  ROWS=Math.max(3,Math.floor(usableH/CELL));
  mazeOX=(usableW-COLS*CELL)/2;
  mazeOY=HUD_H+(usableH-ROWS*CELL)/2;
  walls=[];
  // wallGrid[r][c] = {right,bottom} 존재여부
  wallGrid=Array.from({length:ROWS+1},()=>Array.from({length:COLS+1},()=>({right:false,bottom:false})));

  const cw=Array.from({length:ROWS},()=>Array(COLS).fill(3));
  const vis=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  const stack=[{r:0,c:0}];vis[0][0]=true;
  while(stack.length){
    const{r,c}=stack[stack.length-1];
    const nbrs=shuffle([[0,1],[0,-1],[1,0],[-1,0]]).map(([dr,dc])=>({dr,dc,nr:r+dr,nc:c+dc})).filter(({nr,nc})=>nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!vis[nr][nc]);
    if(!nbrs.length){stack.pop();continue;}
    const{dr,dc,nr,nc}=nbrs[0];vis[nr][nc]=true;
    if(dr===0&&dc===1)cw[r][c]&=~1;if(dr===0&&dc===-1)cw[r][nc]&=~1;
    if(dr===1&&dc===0)cw[r][c]&=~2;if(dr===-1&&dc===0)cw[nr][nc]&=~2;
    stack.push({r:nr,c:nc});
  }
  // 추가 벽 20% 제거 (더 개방적)
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(Math.random()<0.20){if(c<COLS-1)cw[r][c]&=~1;else if(r<ROWS-1)cw[r][c]&=~2;}}

  function addWall(x1,y1,x2,y2){
    const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
    if(len<0.01)return;walls.push({x1,y1,x2,y2,nx:-dy/len,ny:dx/len,len});
  }
  addWall(mazeOX,mazeOY,mazeOX+COLS*CELL,mazeOY);
  addWall(mazeOX,mazeOY+ROWS*CELL,mazeOX+COLS*CELL,mazeOY+ROWS*CELL);
  addWall(mazeOX,mazeOY,mazeOX,mazeOY+ROWS*CELL);
  addWall(mazeOX+COLS*CELL,mazeOY,mazeOX+COLS*CELL,mazeOY+ROWS*CELL);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=mazeOX+c*CELL,y=mazeOY+r*CELL;
    if(cw[r][c]&1){addWall(x+CELL,y,x+CELL,y+CELL);wallGrid[r][c].right=true;}
    if(cw[r][c]&2){addWall(x,y+CELL,x+CELL,y+CELL);wallGrid[r][c].bottom=true;}
  }
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

// ── 골 ───────────────────────────────────────────────────────────────────────
let GOAL={},goalActive=false,goalTimer=0;
const GOAL_DELAY=10000; // 10초
function placeGoal(){
  GOAL={x:mazeOX+(COLS-1)*CELL+8,y:mazeOY+(ROWS-1)*CELL+8,w:CELL-16,h:CELL-16};
  goalActive=false;goalTimer=0;
}

// ── 홍수 (10초 후 출발점에서 미로를 채워옴) ──────────────────────────────────
let floodActive=false;
let floodCells=new Set(); // "r,c" 형태
let floodFrontier=[]; // BFS frontier
let floodInterval=null;
let floodExpanded=0; // 몇 번 확장됐는지

function startFlood(){
  floodActive=true;
  floodCells.clear();
  floodFrontier=[];
  floodExpanded=0;
  // 출발점: 좌상단 셀들
  const startCells=[[0,0],[0,1],[1,0]];
  for(const[r,c]of startCells){
    const key=r+','+c;
    if(!floodCells.has(key)){floodCells.add(key);floodFrontier.push({r,c});}
  }
}

function expandFlood(){
  if(!floodActive||floodFrontier.length===0)return;
  // 속도배율에 따라 확장 속도도 조절
  const steps=Math.max(1,Math.round(speedMult));
  for(let s=0;s<steps;s++){
    if(floodFrontier.length===0)break;
    const next=[];
    for(const{r,c}of floodFrontier){
      // 이웃 탐색 (벽 없는 방향)
      const nbrs=[];
      // right: wallGrid[r][c].right 없으면 통과
      if(c+1<COLS&&!wallGrid[r][c].right)nbrs.push([r,c+1]);
      if(c-1>=0&&!wallGrid[r][c-1].right)nbrs.push([r,c-1]);
      if(r+1<ROWS&&!wallGrid[r][c].bottom)nbrs.push([r+1,c]);
      if(r-1>=0&&!wallGrid[r-1][c].bottom)nbrs.push([r-1,c]);
      for(const[nr,nc]of nbrs){
        const key=nr+','+nc;
        if(!floodCells.has(key)){floodCells.add(key);next.push({r:nr,c:nc});}
      }
    }
    floodFrontier=next;
    floodExpanded++;
  }
}

function drawFlood(){
  if(!floodActive)return;
  floodCtx.clearRect(0,0,W,H);
  floodCtx.fillStyle='rgba(180,30,30,0.55)';
  for(const key of floodCells){
    const[r,c]=key.split(',').map(Number);
    floodCtx.fillRect(mazeOX+c*CELL+1,mazeOY+r*CELL+1,CELL-2,CELL-2);
  }
}

// ── 자동차 ────────────────────────────────────────────────────────────────────
const BASE_SPEED=3.2, MAX_SPEED_BASE=7.0, MIN_SPEED_BASE=2.4;
const CAR_R=15;
const RESTITUTION=0.78,WALL_REST=0.72,FRICTION=0.9988;
let cars=[],particles=[],gameOver=false,gameStarted=false,animId,lastTime=0;
let finishers=[]; // 완주 순서

function spawnCars(){
  const count=Math.min(Math.max(parseInt(document.getElementById('carCount').value)||10,3),30);
  cars=[];finishers=[];
  const base=shuffle([...SPRUNKI]);
  const chars=[];
  for(let i=0;i<count;i++){
    const orig=base[i%base.length];
    chars.push(i<base.length?{...orig}:{name:orig.name+(Math.floor(i/base.length)+2),color:lighten(orig.color,(Math.floor(i/base.length)%2===0?50:-50))});
  }
  for(let i=0;i<count;i++){
    // 출발 위치: 좌상단 영역 분산
    const r=Math.floor(i/(COLS>3?3:1))%Math.min(3,ROWS);
    const c=i%Math.min(3,COLS);
    const ang=Math.random()*Math.PI*2;
    const sp=BASE_SPEED+(Math.random()-.5)*0.6;
    const ch=chars[i];
    cars.push({
      name:ch.name,color:ch.color,
      x:mazeOX+c*CELL+CELL/2+(Math.random()-.5)*12,
      y:mazeOY+r*CELL+CELL/2+(Math.random()-.5)*12,
      vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
      omega:0,angle:ang,trail:[],alive:true,spinDecay:0.85,finished:false
    });
  }
  particles=[];buildRankBar();
}

function buildRankBar(){
  const rb=document.getElementById('rankBar');
  rb.innerHTML='';
  for(const c of cars){
    const div=document.createElement('div');div.className='rk-item';div.id='rk-'+c.name;
    div.style.cssText='background:'+c.color+'22;border-color:'+c.color+'88;color:'+c.color;
    div.innerHTML='<span class="rk-dot" style="background:'+c.color+'"></span>'+c.name;
    rb.appendChild(div);
  }
}

// ── 파티클 ────────────────────────────────────────────────────────────────────
function spawnImpact(x,y,vx,vy,color,intensity){
  for(let i=0;i<Math.floor(6+intensity*8);i++){
    const spd=(1+Math.random()*2.5)*intensity;
    const ang=Math.atan2(vy,vx)+Math.PI+(Math.random()-.5)*Math.PI*1.8;
    particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:1,decay:.05+Math.random()*.04,r:1.5+Math.random()*2.5,color,sw:false});
  }
  for(let i=0;i<3;i++){const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*2.5;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.07+Math.random()*.05,r:1.5,color:'#ffe066',sw:false});}
}
function updateParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=p.decay;if(p.life<=0){particles.splice(i,1);continue;}if(p.sw){p.r+=2;continue;}p.x+=p.vx;p.y+=p.vy;p.vx*=.88;p.vy*=.88;}}
function drawParticles(){ctx.save();ctx.shadowBlur=0;for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);if(p.sw){ctx.strokeStyle=p.color;ctx.lineWidth=p.lw||2;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();}else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}}ctx.globalAlpha=1;ctx.restore();}

// ── 물리 ─────────────────────────────────────────────────────────────────────
function curSpeed(){return BASE_SPEED*speedMult;}
function curMax(){return MAX_SPEED_BASE*speedMult;}
function curMin(){return MIN_SPEED_BASE*speedMult;}

function enforceSpeed(c){
  const s=Math.sqrt(c.vx*c.vx+c.vy*c.vy);
  if(s>.01){
    const mn=curMin(),mx=curMax();
    if(s<mn){c.vx=c.vx/s*mn;c.vy=c.vy/s*mn;}
    else if(s>mx){c.vx=c.vx/s*mx;c.vy=c.vy/s*mx;}
  }
}
function resolveWall(car){
  for(const w of walls){
    const{x1,y1,x2,y2,nx,ny,len}=w;
    const dx=car.x-x1,dy=car.y-y1;
    const dist=dx*nx+dy*ny;
    if(dist>CAR_R||dist<-CAR_R)continue;
    const wx=x2-x1,wy=y2-y1,t=(dx*wx+dy*wy)/(len*len);
    if(t<-.01||t>1.01)continue;
    if(Math.abs(dist)<CAR_R){
      const pen=CAR_R-Math.abs(dist),sg=dist<0?-1:1;
      car.x+=nx*pen*sg;car.y+=ny*pen*sg;
      const vn=car.vx*nx+car.vy*ny;
      if(vn*sg>0)continue;
      const j=-(1+WALL_REST)*vn;
      car.vx+=j*nx;car.vy+=j*ny;
      const tx=-ny,ty=nx,vt=car.vx*tx+car.vy*ty;
      car.vx-=.07*vt*tx;car.vy-=.07*vt*ty;
      car.omega=vt*.035;
      spawnImpact(car.x,car.y,car.vx,car.vy,car.color,1);
      enforceSpeed(car);
    }
  }
}
function resolveCarCar(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist===0||dist>=CAR_R*2)return;
  const nx=dx/dist,ny=dy/dist;
  const ov=(CAR_R*2-dist)/2+.5;
  a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
  const rvx=a.vx-b.vx,rvy=a.vy-b.vy,vRel=rvx*nx+rvy*ny;
  if(vRel<=0)return;
  const j=-(1+RESTITUTION)*vRel*.5;
  a.vx+=j*nx;a.vy+=j*ny;b.vx-=j*nx;b.vy-=j*ny;
  const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty;
  a.omega+=vt*.04;b.omega-=vt*.04;
  enforceSpeed(a);enforceSpeed(b);
  spawnImpact((a.x+b.x)/2,(a.y+b.y)/2,rvx,rvy,'#fff',1.2);
}

// ── 홍수로 자동차 밀기 ────────────────────────────────────────────────────────
function pushCarsFromFlood(){
  if(!floodActive)return;
  for(const car of cars){
    if(!car.alive||car.finished)continue;
    const cr=Math.floor((car.y-mazeOY)/CELL);
    const cc=Math.floor((car.x-mazeOX)/CELL);
    const key=cr+','+cc;
    if(floodCells.has(key)){
      // 홍수 셀에 있으면 골 방향으로 강제 이동
      const gx=GOAL.x+GOAL.w/2,gy=GOAL.y+GOAL.h/2;
      const ddx=gx-car.x,ddy=gy-car.y;
      const dlen=Math.sqrt(ddx*ddx+ddy*ddy)||1;
      car.vx+=ddx/dlen*0.8*speedMult;
      car.vy+=ddy/dlen*0.8*speedMult;
      enforceSpeed(car);
    }
  }
}

// ── 폭죽 ─────────────────────────────────────────────────────────────────────
let confetti=[];
function launchConfetti(){
  confetti=[];
  for(let i=0;i<220;i++){
    const colors=['#e94560','#f9a825','#4caf50','#4dd0e1','#a29bfe','#ff6b6b','#ffd700','#fff'];
    confetti.push({
      x:Math.random()*W,y:-10-Math.random()*100,
      vx:(Math.random()-.5)*4,vy:2+Math.random()*4,
      color:colors[Math.floor(Math.random()*colors.length)],
      size:6+Math.random()*8,rot:Math.random()*Math.PI*2,
      rotV:(Math.random()-.5)*0.2,life:1,decay:0.004+Math.random()*0.003
    });
  }
}
function updateConfetti(){for(let i=confetti.length-1;i>=0;i--){const p=confetti[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.rot+=p.rotV;p.life-=p.decay;if(p.y>H+20||p.life<=0)confetti.splice(i,1);}}
function drawConfetti(){
  confCtx.clearRect(0,0,W,H);
  for(const p of confetti){
    confCtx.save();confCtx.globalAlpha=p.life;
    confCtx.translate(p.x,p.y);confCtx.rotate(p.rot);
    confCtx.fillStyle=p.color;
    confCtx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
    confCtx.restore();
  }
}

// ── 시상대 ────────────────────────────────────────────────────────────────────
function showPodium(){
  // finishers[0]=1등, [1]=2등, [2]=3등
  const pw=document.getElementById('podiumWrap');
  pw.innerHTML='';
  const order=[1,0,2]; // 2등-1등-3등 배치
  const heights=[80,110,60];
  const medals=['🥈','🥇','🥉'];
  const bgColors=['#bdbdbd','#ffd700','#cd7f32'];
  order.forEach((pos,i)=>{
    const f=finishers[pos];
    if(!f)return;
    const col=document.createElement('div');col.className='podium-col';
    // 메달
    const rank=document.createElement('div');rank.className='podium-rank';rank.textContent=medals[i];
    // 얼굴
    const fc=document.createElement('canvas');fc.className='podium-face';
    const fsz=pos===0?80:64;fc.width=fsz;fc.height=fsz;
    const fctx=fc.getContext('2d');
    fctx.fillStyle=f.color+'33';fctx.beginPath();fctx.arc(fsz/2,fsz/2,fsz/2,0,Math.PI*2);fctx.fill();
    drawFace(f,fsz/2,fsz/2,fsz*0.72,fctx);
    // 이름
    const nm=document.createElement('div');nm.className='podium-name';nm.style.color=f.color;nm.textContent=f.name;
    // 시상대 블록
    const blk=document.createElement('div');blk.className='podium-block';
    blk.style.cssText='height:'+heights[i]+'px;background:'+bgColors[i]+';display:flex;align-items:center;justify-content:center;font-size:'+Math.min(5.5*16/10,20)+'px;font-weight:bold;color:#000;';
    blk.textContent=pos+1;
    col.appendChild(rank);col.appendChild(fc);col.appendChild(nm);col.appendChild(blk);
    pw.appendChild(col);
  });
  document.getElementById('overlay').classList.add('show');
  launchConfetti();
  requestAnimationFrame(confLoop);
}
function confLoop(){
  if(confetti.length===0){confCtx.clearRect(0,0,W,H);return;}
  updateConfetti();drawConfetti();requestAnimationFrame(confLoop);
}

// ── 업데이트 ──────────────────────────────────────────────────────────────────
function update(dt){
  const scaledDt=dt; // 물리 루프 dt 그대로, 속도는 enforceSpeed에서 처리
  if(!goalActive){
    goalTimer+=dt;
    if(goalTimer>=GOAL_DELAY){goalActive=true;startFlood();}
  }
  if(floodActive)expandFlood();
  pushCarsFromFlood();
  updateParticles();

  for(const c of cars){
    if(!c.alive||c.finished)continue;
    c.trail.push({x:c.x,y:c.y});if(c.trail.length>14)c.trail.shift();
    c.x+=c.vx;c.y+=c.vy;
    c.vx*=FRICTION;c.vy*=FRICTION;
    c.angle+=c.omega;c.omega*=c.spinDecay;
    if(Math.abs(c.omega)<.025){
      let da=Math.atan2(c.vy,c.vx)-c.angle;
      while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
      c.angle+=da*.2;
    }
    enforceSpeed(c);resolveWall(c);
  }
  for(let it=0;it<2;it++)
    for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++)
      if(cars[i].alive&&!cars[i].finished&&cars[j].alive&&!cars[j].finished)
        resolveCarCar(cars[i],cars[j]);

  if(goalActive){
    for(const c of cars){
      if(!c.alive||c.finished)continue;
      if(c.x>GOAL.x&&c.x<GOAL.x+GOAL.w&&c.y>GOAL.y&&c.y<GOAL.y+GOAL.h){
        c.finished=true;
        finishers.push({name:c.name,color:c.color});
        // 순위 표시 업데이트
        const el=document.getElementById('rk-'+c.name);
        if(el){
          el.style.background=c.color+'55';
          el.style.border='2px solid '+c.color;
          el.innerHTML='<span class="rk-dot" style="background:'+c.color+'"></span>'+['🥇','🥈','🥉'][finishers.length-1]+(finishers.length)+'등 '+c.name;
        }
        // 3등 들어오면 게임 종료
        if(finishers.length>=3){
          gameOver=true;
          setTimeout(showPodium,400);
          return;
        }
      }
    }
  }
  const remain=Math.max(0,(GOAL_DELAY-goalTimer)/1000);
  document.getElementById('timer').textContent=goalActive?'🏁 GOAL 활성!':'⏱ '+remain.toFixed(1)+'s';
}

// ── 그리기 ────────────────────────────────────────────────────────────────────
function drawMaze(){
  ctx.save();ctx.strokeStyle='#2a9d8f';ctx.lineWidth=3;ctx.shadowColor='#2a9d8f';ctx.shadowBlur=8;
  for(const w of walls){ctx.beginPath();ctx.moveTo(w.x1,w.y1);ctx.lineTo(w.x2,w.y2);ctx.stroke();}
  ctx.restore();
}
function drawGoal(){
  const pulse=Math.sin(Date.now()/180)*.15;ctx.save();
  if(!goalActive){
    const rem=Math.max(0,(GOAL_DELAY-goalTimer)/1000);
    ctx.fillStyle='rgba(80,80,80,'+(0.22+Math.abs(pulse))+')';ctx.fillRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);
    ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.strokeRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);ctx.setLineDash([]);
    ctx.fillStyle='#888';ctx.font='bold 13px Arial';ctx.textAlign='center';
    ctx.fillText('🔒',GOAL.x+GOAL.w/2,GOAL.y+GOAL.h/2-5);
    ctx.fillText(rem.toFixed(1)+'s',GOAL.x+GOAL.w/2,GOAL.y+GOAL.h/2+12);
  } else {
    ctx.shadowColor='#ffd700';ctx.shadowBlur=32;
    ctx.fillStyle='rgba(255,215,0,'+(0.32+pulse)+')';ctx.fillRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);
    ctx.strokeStyle='#ffd700';ctx.lineWidth=2.5;ctx.setLineDash([5,3]);ctx.strokeRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);ctx.setLineDash([]);
    ctx.shadowBlur=0;ctx.fillStyle='#ffd700';ctx.font='bold 15px Arial';ctx.textAlign='center';
    ctx.fillText('🏁',GOAL.x+GOAL.w/2,GOAL.y+GOAL.h/2-6);ctx.fillText('GOAL',GOAL.x+GOAL.w/2,GOAL.y+GOAL.h/2+12);
  }
  ctx.restore();
}
function drawCar(c){
  ctx.save();ctx.shadowBlur=0;
  for(let i=0;i<c.trail.length;i++){
    const a=(i/c.trail.length)*.2;const hex=Math.floor(a*255).toString(16).padStart(2,'0');
    ctx.fillStyle=c.color+hex;ctx.beginPath();ctx.arc(c.trail[i].x,c.trail[i].y,2.5*(i/c.trail.length),0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  if(c.finished){
    ctx.save();ctx.globalAlpha=0.35;ctx.translate(c.x,c.y);ctx.rotate(c.angle);drawCarShape(c.color,.85);ctx.restore();
    return;
  }
  ctx.save();ctx.shadowColor=c.color;ctx.shadowBlur=10;ctx.strokeStyle=c.color+'66';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(c.x,c.y,CAR_R+2,0,Math.PI*2);ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);drawCarShape(c.color,.85);ctx.restore();
}
function drawCarShape(color,sc){
  const s=sc||1,W2=16*s,H2=9*s;
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(1*s,2*s,W2*.88,H2*.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-W2,-H2,W2*2,H2*2,4*s);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.roundRect(-W2+2*s,-H2+2*s,W2*1.1,H2*.88,3*s);ctx.fill();
  ctx.fillStyle='rgba(20,30,50,0.82)';ctx.beginPath();ctx.roundRect(-4*s,-H2+2.5*s,10*s,H2*2-5*s,3*s);ctx.fill();
  ctx.fillStyle=lighten(color,-28);ctx.fillRect(W2-3*s,-H2+1*s,4*s,H2*2-2*s);
  ctx.fillStyle=lighten(color,-40);ctx.fillRect(-W2-2*s,-H2+2*s,3*s,H2*2-4*s);
  ctx.fillStyle='#fffde7';ctx.shadowColor='#fff8e1';ctx.shadowBlur=5*s;
  ctx.beginPath();ctx.arc(W2-1*s,-H2+2*s,2*s,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(W2-1*s,H2-2*s,2*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff1744';ctx.shadowColor='#ff1744';ctx.shadowBlur=4*s;
  ctx.beginPath();ctx.arc(-W2+1*s,-H2+2*s,1.8*s,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(-W2+1*s,H2-2*s,1.8*s,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a0f1a';ctx.fillRect(0,0,W,H);
  drawMaze();drawFlood();drawGoal();drawParticles();cars.forEach(drawCar);
}
function loop(ts){
  if(gameOver)return;
  const dt=Math.min(ts-lastTime,50);lastTime=ts;
  update(dt);draw();
  animId=requestAnimationFrame(loop);
}

// ── 시작/재시작 ───────────────────────────────────────────────────────────────
function startGame(){
  const v=parseInt(document.getElementById('carCount').value)||10;
  if(v<3||v>30){alert('3~30 사이로 입력해주세요!');return;}
  gameOver=false;gameStarted=true;floodActive=false;
  confetti=[];confCtx.clearRect(0,0,W,H);
  document.getElementById('startScreen').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('rankBar').style.display='flex';
  document.getElementById('overlay').classList.remove('show');
  resize();buildMaze();placeGoal();spawnCars();
  cancelAnimationFrame(animId);lastTime=performance.now();animId=requestAnimationFrame(loop);
}
function showStart(){
  gameOver=false;gameStarted=false;
  cancelAnimationFrame(animId);
  confetti=[];confCtx.clearRect(0,0,W,H);floodCtx.clearRect(0,0,W,H);
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('hud').style.display='none';
  document.getElementById('rankBar').style.display='none';
  document.getElementById('startScreen').style.display='flex';
}
document.getElementById('carCount').addEventListener('keydown',e=>{if(e.key==='Enter')startGame();});
resize();
</script>
